<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Xairod · Business Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,800;0,9..144,900&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Outfit',sans-serif;background:#0D0A05;color:#FEFCF7;min-height:100vh;}
input,textarea,select{font-family:'Outfit',sans-serif;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px;}
.sidebar{width:220px;background:#141008;border-right:1px solid rgba(255,255,255,0.06);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;overflow-y:auto;}
.main-wrap{margin-left:220px;min-height:100vh;}
.topbar{background:#141008;border-bottom:1px solid rgba(255,255,255,0.06);padding:0 28px;height:58px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
.content{padding:24px 28px 48px;}
.card{background:#141008;border-radius:14px;border:1px solid rgba(255,255,255,0.07);padding:20px;}
.input{width:100%;padding:11px 14px;border-radius:10px;border:1.5px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:#FEFCF7;font-size:13px;outline:none;transition:border-color 0.15s;}
.input:focus{border-color:#4DD994;}
.input::placeholder{color:rgba(255,255,255,0.2);}
select.input option{background:#1a1510;color:#FEFCF7;}
.label{font-size:11px;font-weight:700;color:rgba(255,255,255,0.4);margin-bottom:6px;display:block;text-transform:uppercase;letter-spacing:0.8px;}
.btn-primary{background:#4DD994;color:#03311A;border:none;padding:12px 20px;border-radius:10px;font-weight:800;font-size:13px;cursor:pointer;}
.btn-primary:disabled{opacity:0.4;cursor:default;}
.btn-outline{background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.7);border:1px solid rgba(255,255,255,0.1);padding:10px 18px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;}
.btn-red{background:rgba(192,57,43,0.15);color:#E74C3C;border:1px solid rgba(192,57,43,0.25);padding:8px 14px;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;margin-bottom:2px;font-size:12px;font-weight:600;color:rgba(255,255,255,0.4);transition:all 0.15s;}
.nav-item:hover{background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.8);}
.nav-item.active{background:rgba(77,217,148,0.12);color:#4DD994;font-weight:700;}
.badge-pill{padding:3px 9px;border-radius:20px;font-size:9px;font-weight:800;text-transform:uppercase;}
.badge-new{background:rgba(93,173,226,0.2);color:#5DADE2;}
.badge-quoted{background:rgba(245,197,80,0.2);color:#F5C550;}
.badge-progress{background:rgba(200,134,26,0.2);color:#F5C550;}
.badge-completed{background:rgba(77,217,148,0.2);color:#4DD994;}
.stat-card{background:#141008;border-radius:12px;border:1px solid rgba(255,255,255,0.07);padding:18px;position:relative;overflow:hidden;}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
.stat-green::before{background:linear-gradient(90deg,#0A6B3E,#4DD994);}
.stat-gold::before{background:linear-gradient(90deg,#C8861A,#F5C550);}
.stat-blue::before{background:linear-gradient(90deg,#2471A3,#5DADE2);}
.stat-purple::before{background:linear-gradient(90deg,#8E44AD,#BB8FCE);}
.table-wrap{background:#141008;border-radius:14px;border:1px solid rgba(255,255,255,0.07);overflow:hidden;}
table{width:100%;border-collapse:collapse;}
th{padding:10px 16px;text-align:left;font-size:9px;font-weight:700;color:rgba(255,255,255,0.25);text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid rgba(255,255,255,0.05);}
td{padding:13px 16px;font-size:12px;color:rgba(255,255,255,0.55);border-bottom:1px solid rgba(255,255,255,0.04);}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(255,255,255,0.02);}
.td-main{font-weight:700;color:#FEFCF7;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:#1a1510;border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:24px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;}
.form-group{margin-bottom:14px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.alert{padding:10px 14px;border-radius:8px;font-size:12px;font-weight:600;margin-bottom:12px;}
.alert-error{background:rgba(192,57,43,0.12);border:1px solid rgba(192,57,43,0.25);color:#E74C3C;}
.alert-success{background:rgba(77,217,148,0.1);border:1px solid rgba(77,217,148,0.2);color:#4DD994;}
.alert-warn{background:rgba(200,134,26,0.1);border:1px solid rgba(200,134,26,0.2);color:#F5C550;}
.request-card{background:#141008;border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:16px;margin-bottom:10px;}
.ref-tag{font-family:monospace;font-size:10px;font-weight:700;color:#4DD994;background:rgba(77,217,148,0.1);padding:3px 8px;border-radius:4px;display:inline-block;}
.empty-state{text-align:center;padding:48px 20px;color:rgba(255,255,255,0.3);}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

// ── CONFIG ────────────────────────────────────────────────────────────────────
const SUPA_URL = "REPLACE_WITH_YOUR_SUPABASE_URL";
const SUPA_KEY = "REPLACE_WITH_YOUR_SUPABASE_ANON_KEY";
const { createClient } = supabase;
const sb = createClient(SUPA_URL, SUPA_KEY);

const COMMISSION_RATES = {
  agency:12, housing:10, health:15, travel:12,
  food:10, transport:17, beauty:12, default:12
};

const CATEGORIES = [
  "Agency / Admission","Housing","Health","Travel",
  "Food & Catering","Transport","Beauty","Finance","Jobs","Other"
];

const CAT_MAP = {
  "Agency / Admission":"agency","Housing":"housing","Health":"health",
  "Travel":"travel","Food & Catering":"food","Transport":"transport",
  "Beauty":"beauty","Finance":"finance","Jobs":"jobs","Other":"other"
};

// ── AUTH SCREEN ───────────────────────────────────────────────────────────────
function AuthScreen({onAuth}){
  const[view,setView]=useState("login");
  const[loading,setLoading]=useState(false);
  const[err,setErr]=useState("");
  const[success,setSuccess]=useState("");
  const[step,setStep]=useState(1);
  // Login
  const[email,setEmail]=useState("");
  const[password,setPassword]=useState("");
  // Register
  const[bizName,setBizName]=useState("");
  const[bizCat,setBizCat]=useState("");
  const[bizCity,setBizCity]=useState("Cairo, Egypt");
  const[bizPhone,setBizPhone]=useState("");
  const[bizDesc,setBizDesc]=useState("");
  const[ownerName,setOwnerName]=useState("");
  const[regEmail,setRegEmail]=useState("");
  const[regPwd,setRegPwd]=useState("");
  const[regPwd2,setRegPwd2]=useState("");
  const[agreed,setAgreed]=useState(false);

  const login=async()=>{
    if(!email||!password){setErr("Enter your email and password.");return;}
    setLoading(true);setErr("");
    const{data,error}=await sb.auth.signInWithPassword({email,password});
    if(error){setErr("Incorrect email or password.");setLoading(false);return;}
    const{data:biz}=await sb.from("business_accounts").select("*").eq("user_id",data.user.id).single();
    if(!biz){setErr("No business account found for this email.");setLoading(false);return;}
    onAuth(data.user,biz);setLoading(false);
  };

  const register=async()=>{
    if(!bizName||!bizCat||!ownerName||!regEmail||!regPwd){setErr("Fill all required fields.");return;}
    if(regPwd!==regPwd2){setErr("Passwords do not match.");return;}
    if(regPwd.length<8){setErr("Password must be at least 8 characters.");return;}
    if(!agreed){setErr("Please accept the Partner Agreement.");return;}
    setLoading(true);setErr("");
    const{data,error}=await sb.auth.signUp({email:regEmail,password:regPwd});
    if(error){setErr(error.message);setLoading(false);return;}

    // data.user can be null if email confirmation is enabled — handle both cases
    const userId=data?.user?.id||data?.session?.user?.id;
    if(!userId){
      setSuccess("Almost there! Check your email and click the confirmation link. Once confirmed, come back and sign in.");
      setLoading(false);return;
    }

    const catKey=CAT_MAP[bizCat]||"other";
    // Create profile
    await sb.from("profiles").upsert({
      id:userId,name:ownerName,email:regEmail,role:"Business Owner"
    });
    // Create business account
    const{error:bizErr}=await sb.from("business_accounts").insert({
      user_id:userId,name:bizName,category:catKey,category_label:bizCat,
      city:bizCity,phone:bizPhone,description:bizDesc,owner_name:ownerName,
      email:regEmail,status:"pending",commission_rate:COMMISSION_RATES[catKey]||12
    });
    if(bizErr){
      setErr("Account created but profile setup failed: "+bizErr.message+". Please contact hello@xairod.com");
      setLoading(false);return;
    }
    setSuccess("Account created! Xairod will review and activate your listing within 24 hours.");
    setLoading(false);
  };

  return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{width:"100%",maxWidth:420}}>
        <div style={{textAlign:"center",marginBottom:32}}>
          <div style={{fontFamily:"'Fraunces',serif",fontSize:32,fontWeight:900}}>
            <span style={{color:"#4DD994"}}>X</span>airod<span style={{color:"#C8861A"}}>.</span>
          </div>
          <div style={{fontSize:11,color:"rgba(255,255,255,0.3)",fontWeight:700,letterSpacing:2,textTransform:"uppercase",marginTop:4}}>Business Partner Portal</div>
        </div>
        <div style={{background:"#141008",border:"1px solid rgba(255,255,255,0.08)",borderRadius:16,padding:28}}>
          {view!=="forgot"&&(
            <div style={{display:"flex",gap:4,background:"rgba(255,255,255,0.04)",borderRadius:8,padding:4,marginBottom:24}}>
              {["login","register"].map(v=>(
                <button key={v} onClick={()=>{setView(v);setErr("");setSuccess("");setStep(1);}}
                  style={{flex:1,padding:8,borderRadius:6,border:"none",background:view===v?"#4DD994":"transparent",color:view===v?"#03311A":"rgba(255,255,255,0.4)",fontWeight:800,fontSize:12,cursor:"pointer"}}>
                  {v==="login"?"Sign In":"Register Business"}
                </button>
              ))}
            </div>
          )}
          {err&&<div className="alert alert-error">{err}</div>}
          {success&&<div className="alert alert-success">{success}</div>}

          {view==="login"&&!success&&(
            <>
              <div className="form-group"><label className="label">Email Address</label>
                <input className="input" type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="hello@yourbusiness.com"/></div>
              <div className="form-group"><label className="label">Password</label>
                <input className="input" type="password" value={password} onChange={e=>setPassword(e.target.value)}
                  placeholder="••••••••" onKeyDown={e=>e.key==="Enter"&&login()}/></div>
              <button className="btn-primary" onClick={login} disabled={loading} style={{width:"100%",marginBottom:12}}>
                {loading?"Signing in…":"Sign In →"}</button>
              <div style={{textAlign:"center"}}>
                <button onClick={()=>{setView("forgot");setErr("");}}
                  style={{background:"none",border:"none",color:"#4DD994",cursor:"pointer",fontSize:11,fontWeight:700}}>Forgot password?</button>
              </div>
            </>
          )}

          {view==="forgot"&&(
            <>
              <div style={{fontFamily:"'Fraunces',serif",fontSize:18,fontWeight:800,marginBottom:6}}>Reset Password</div>
              <div style={{fontSize:12,color:"rgba(255,255,255,0.4)",marginBottom:18,lineHeight:1.6}}>Enter your business email and we'll send a reset link.</div>
              <div className="form-group"><label className="label">Email</label>
                <input className="input" type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="hello@yourbusiness.com"/></div>
              <button className="btn-primary" onClick={async()=>{
                if(!email){setErr("Enter your email.");return;}
                setLoading(true);
                await sb.auth.resetPasswordForEmail(email,{redirectTo:"https://business.xairod.com"});
                setSuccess("Reset link sent! Check your inbox.");setLoading(false);
              }} disabled={loading} style={{width:"100%",marginBottom:12}}>
                {loading?"Sending…":"Send Reset Link"}</button>
              <button onClick={()=>setView("login")} style={{width:"100%",background:"none",border:"none",color:"rgba(255,255,255,0.3)",cursor:"pointer",fontSize:12}}>← Back</button>
            </>
          )}

          {view==="register"&&!success&&(
            <>
              <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:20}}>
                {[1,2].map((n,i)=>(
                  <React.Fragment key={n}>
                    <div style={{width:26,height:26,borderRadius:"50%",background:step>n?"#4DD994":step===n?"#C0392B":"rgba(255,255,255,0.08)",color:"white",fontSize:10,fontWeight:800,display:"flex",alignItems:"center",justifyContent:"center"}}>
                      {step>n?"✓":n}
                    </div>
                    {i<1&&<div style={{flex:1,height:2,background:step>n?"#4DD994":"rgba(255,255,255,0.08)",borderRadius:2}}/>}
                  </React.Fragment>
                ))}
              </div>

              {step===1&&(
                <>
                  <div style={{fontSize:12,fontWeight:700,color:"rgba(255,255,255,0.4)",marginBottom:14}}>Business Information</div>
                  <div className="form-group"><label className="label">Business Name *</label>
                    <input className="input" value={bizName} onChange={e=>setBizName(e.target.value)} placeholder="e.g. Universal Prime Agency"/></div>
                  <div className="form-group"><label className="label">Category *</label>
                    <select className="input" value={bizCat} onChange={e=>setBizCat(e.target.value)}>
                      <option value="">Select category…</option>
                      {CATEGORIES.map(c=><option key={c}>{c}</option>)}
                    </select></div>
                  <div className="form-row">
                    <div className="form-group"><label className="label">City</label>
                      <input className="input" value={bizCity} onChange={e=>setBizCity(e.target.value)}/></div>
                    <div className="form-group"><label className="label">WhatsApp</label>
                      <input className="input" value={bizPhone} onChange={e=>setBizPhone(e.target.value)} placeholder="+20 100 000 0000"/></div>
                  </div>
                  <div className="form-group"><label className="label">Description</label>
                    <textarea className="input" rows={3} value={bizDesc} onChange={e=>setBizDesc(e.target.value)} placeholder="What services do you offer?"/></div>
                  <button className="btn-primary" onClick={()=>{
                    if(!bizName||!bizCat){setErr("Business name and category required.");return;}
                    setErr("");setStep(2);
                  }} style={{width:"100%"}}>Continue → Step 2</button>
                </>
              )}

              {step===2&&(
                <>
                  <div style={{fontSize:12,fontWeight:700,color:"rgba(255,255,255,0.4)",marginBottom:14}}>Account Setup</div>
                  <div className="form-group"><label className="label">Your Full Name *</label>
                    <input className="input" value={ownerName} onChange={e=>setOwnerName(e.target.value)} placeholder="Account manager name"/></div>
                  <div className="form-group"><label className="label">Business Email *</label>
                    <input className="input" type="email" value={regEmail} onChange={e=>setRegEmail(e.target.value)} placeholder="hello@yourbusiness.com"/></div>
                  <div className="form-group"><label className="label">Password *</label>
                    <input className="input" type="password" value={regPwd} onChange={e=>setRegPwd(e.target.value)} placeholder="Minimum 8 characters"/></div>
                  <div className="form-group"><label className="label">Confirm Password *</label>
                    <input className="input" type="password" value={regPwd2} onChange={e=>setRegPwd2(e.target.value)} placeholder="Repeat password"/></div>
                  <div style={{display:"flex",gap:10,marginBottom:16,alignItems:"flex-start"}}>
                    <button onClick={()=>setAgreed(!agreed)}
                      style={{width:20,height:20,borderRadius:4,border:`2px solid ${agreed?"#4DD994":"rgba(255,255,255,0.2)"}`,background:agreed?"#4DD994":"transparent",cursor:"pointer",flexShrink:0,marginTop:2,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10}}>
                      {agreed?"✓":""}</button>
                    <div style={{fontSize:11,color:"rgba(255,255,255,0.4)",lineHeight:1.6}}>
                      I agree to the <a href="https://xairod.com/terms" target="_blank" style={{color:"#4DD994"}}>Xairod Partner Agreement</a> including the commission structure ({COMMISSION_RATES[CAT_MAP[bizCat]]||12}% per completed deal).
                    </div>
                  </div>
                  <div style={{display:"flex",gap:10}}>
                    <button className="btn-outline" onClick={()=>setStep(1)} style={{flex:1}}>← Back</button>
                    <button className="btn-primary" onClick={register} disabled={loading} style={{flex:2}}>
                      {loading?"Creating account…":"Create Account →"}</button>
                  </div>
                </>
              )}
            </>
          )}
        </div>
        <div style={{marginTop:16,display:"flex",gap:16,justifyContent:"center"}}>
          {["🔒 Secure","✓ Verified","💬 WhatsApp"].map(t=>(
            <div key={t} style={{fontSize:10,color:"rgba(255,255,255,0.2)",fontWeight:600}}>{t}</div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ── SIDEBAR ───────────────────────────────────────────────────────────────────
function Sidebar({page,setPage,biz,newLeads,onSignOut}){
  const nav=[
    {id:"dashboard",icon:"⊞",label:"Dashboard"},
    {id:"requests",icon:"📥",label:"Requests",badge:newLeads},
    {id:"bookings",icon:"✅",label:"Bookings"},
    {id:"payouts",icon:"💰",label:"Payouts"},
    {id:"listing",icon:"🏢",label:"My Listing"},
    {id:"settings",icon:"⚙️",label:"Settings"},
  ];
  return(
    <div className="sidebar">
      <div style={{padding:"20px 18px 16px",borderBottom:"1px solid rgba(255,255,255,0.06)"}}>
        <div style={{fontFamily:"'Fraunces',serif",fontSize:20,fontWeight:900}}>
          <span style={{color:"#4DD994"}}>X</span>airod<span style={{color:"#C8861A"}}>.</span>
          <span style={{fontSize:10,color:"rgba(255,255,255,0.3)",fontWeight:600,marginLeft:4}}>Business</span>
        </div>
      </div>
      <div style={{margin:"12px 12px 0",background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:10,padding:"10px 12px"}}>
        <div style={{fontSize:12,fontWeight:700,color:"#FEFCF7",marginBottom:3,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{biz?.name||"Your Business"}</div>
        <div style={{fontSize:9,color:biz?.status==="active"?"#4DD994":"#F5C550",fontWeight:700}}>
          {biz?.status==="active"?"◉ Active":"○ Pending Review"}
        </div>
        {biz?.status==="active"&&<div style={{fontSize:9,color:"rgba(255,255,255,0.25)",marginTop:2}}>Commission: {biz?.commission_rate||12}% per deal</div>}
      </div>
      <div style={{padding:"12px 10px",flex:1}}>
        {nav.map(item=>(
          <div key={item.id} onClick={()=>setPage(item.id)}
            className={`nav-item ${page===item.id?"active":""}`}>
            <span style={{fontSize:14}}>{item.icon}</span>
            <span style={{flex:1}}>{item.label}</span>
            {item.badge>0&&<span style={{background:"#C0392B",color:"white",fontSize:8,fontWeight:800,padding:"2px 5px",borderRadius:10}}>{item.badge}</span>}
          </div>
        ))}
      </div>
      {biz?.status==="pending"&&(
        <div style={{margin:"0 12px 12px",background:"rgba(200,134,26,0.1)",border:"1px solid rgba(200,134,26,0.2)",borderRadius:8,padding:"10px 12px"}}>
          <div style={{fontSize:10,fontWeight:700,color:"#F5C550",marginBottom:3}}>⏳ Under Review</div>
          <div style={{fontSize:9,color:"rgba(255,255,255,0.35)",lineHeight:1.5}}>Xairod will activate your listing within 24 hours.</div>
        </div>
      )}
      <div style={{padding:"12px 14px",borderTop:"1px solid rgba(255,255,255,0.06)"}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
          <div style={{width:30,height:30,borderRadius:"50%",background:"#0A6B3E",display:"flex",alignItems:"center",justifyContent:"center",color:"white",fontSize:12,fontWeight:800,flexShrink:0}}>
            {(biz?.owner_name||"?")[0].toUpperCase()}
          </div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:11,fontWeight:600,color:"#FEFCF7",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{biz?.owner_name||"Account Manager"}</div>
            <div style={{fontSize:9,color:"rgba(255,255,255,0.3)"}}>{biz?.email||""}</div>
          </div>
        </div>
        <button onClick={onSignOut} style={{width:"100%",background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.08)",color:"rgba(255,255,255,0.4)",padding:"7px",borderRadius:8,fontSize:11,fontWeight:700,cursor:"pointer"}}>Sign Out</button>
      </div>
    </div>
  );
}

// ── DASHBOARD ─────────────────────────────────────────────────────────────────
function Dashboard({biz,requests,bookings,setPage}){
  const totalReqs=requests.length;
  const newReqs=requests.filter(r=>r.status==="open").length;
  const converted=bookings.filter(b=>b.status==="completed").length;
  const inProgress=bookings.filter(b=>b.status==="in_progress").length;
  const totalEarned=bookings.filter(b=>b.status==="completed").reduce((s,b)=>s+(b.payout_amount||0),0);
  const convRate=totalReqs>0?Math.round((converted/totalReqs)*100):0;

  return(
    <div className="content">
      {biz?.status==="pending"&&<div className="alert alert-warn" style={{marginBottom:20}}>⏳ Your listing is under review. You'll start receiving requests once approved.</div>}
      {newReqs>0&&(

// ── REQUESTS ──────────────────────────────────────────────────────────────────
function RequestsScreen({biz,requests,onUpdate}){
  const[quoteModal,setQuoteModal]=useState(null);
  const[price,setPrice]=useState("");
  const[timeline,setTimeline]=useState("");
  const[quoteNote,setQuoteNote]=useState("");
  const[loading,setLoading]=useState(false);
  const[err,setErr]=useState("");

  const submitQuote=async()=>{
    if(!price||!timeline){setErr("Price and timeline required.");return;}
    setLoading(true);setErr("");
    const commission=biz?.commission_rate||12;
    const gross=parseFloat(price);
    const commAmt=Math.round(gross*commission/100);
    const payout=gross-commAmt;
    await sb.from("quotes").insert({
      request_id:quoteModal.id,business_id:biz.id,
      price:gross,commission_rate:commission,commission_amount:commAmt,payout_amount:payout,
      timeline,notes:quoteNote,status:"pending"
    });
    await sb.from("service_requests").update({status:"quoted"}).eq("id",quoteModal.id);
    await sb.from("notifications").insert({
      user_id:quoteModal.user_id,icon:"💬",
      message:`${biz.name} sent you a quote for request ${quoteModal.ref}`,type:"quote",
      metadata:{request_id:quoteModal.id}
    }).catch(()=>{});
    onUpdate();setQuoteModal(null);setPrice("");setTimeline("");setQuoteNote("");setLoading(false);
  };

  return(
    <div className="content">
      <div style={{fontFamily:"'Fraunces',serif",fontSize:22,fontWeight:900,color:"#FEFCF7",marginBottom:4}}>Requests</div>
      <div style={{fontSize:11,color:"rgba(255,255,255,0.3)",marginBottom:20}}>{requests.length} total · {requests.filter(r=>r.status==="open").length} new</div>

      {requests.length===0?(
        <div className="empty-state">
          <div style={{fontSize:48,marginBottom:14}}>📭</div>
          <div style={{fontFamily:"'Fraunces',serif",fontSize:18,fontWeight:800,color:"rgba(255,255,255,0.5)",marginBottom:6}}>No requests yet</div>
          <div style={{fontSize:13}}>When users connect with {biz?.name||"your business"} on Xairod, requests appear here in real time.</div>
        </div>
      ):requests.map(req=>(
        <div key={req.id} className="request-card" style={{borderLeft:req.status==="open"?"3px solid #5DADE2":"1px solid rgba(255,255,255,0.07)"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
            <div>
              <span className="ref-tag">{req.ref}</span>
              <span style={{marginLeft:8,fontSize:10,color:"rgba(255,255,255,0.3)"}}>{new Date(req.created_at).toLocaleString()}</span>
            </div>
            <span className={`badge-pill badge-${req.status==="open"?"new":req.status}`}>{req.status==="open"?"New":req.status}</span>
          </div>
          <div style={{fontSize:13,fontWeight:600,color:"#FEFCF7",marginBottom:6,lineHeight:1.5}}>{req.what_i_need}</div>
          <div style={{display:"flex",gap:12,marginBottom:10,flexWrap:"wrap"}}>
            {req.when_needed&&<div style={{fontSize:10,color:"rgba(255,255,255,0.35)"}}>📅 {req.when_needed}</div>}
            {req.budget&&<div style={{fontSize:10,color:"rgba(255,255,255,0.35)"}}>💰 {req.budget}</div>}
          </div>
          {req.status==="open"&&(
            <div style={{display:"flex",gap:8}}>
              <button onClick={()=>{setQuoteModal(req);setErr("");}} className="btn-primary" style={{padding:"8px 18px",fontSize:12}}>Send Quote →</button>
              <button className="btn-red" onClick={async()=>{await sb.from("service_requests").update({status:"declined"}).eq("id",req.id);onUpdate();}}>Decline</button>
            </div>
          )}
          {req.status==="quoted"&&<div style={{fontSize:11,color:"#F5C550",fontWeight:600}}>⏳ Waiting for user to accept your quote</div>}
          {(req.status==="in_progress"||req.status==="accepted")&&<div style={{fontSize:11,color:"#4DD994",fontWeight:600}}>✅ Accepted — deliver the service</div>}
        </div>
      ))}

      {quoteModal&&(
        <div className="modal-overlay" onClick={()=>setQuoteModal(null)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div style={{fontFamily:"'Fraunces',serif",fontSize:18,fontWeight:800,color:"#FEFCF7",marginBottom:16}}>Send Quote</div>
            <div style={{background:"rgba(77,217,148,0.07)",borderRadius:10,padding:"10px 12px",marginBottom:16}}>
              <div style={{fontSize:10,color:"rgba(255,255,255,0.35)",marginBottom:3}}>{quoteModal.ref}</div>
              <div style={{fontSize:12,color:"#FEFCF7",lineHeight:1.5}}>{quoteModal.what_i_need}</div>
            </div>
            {err&&<div className="alert alert-error">{err}</div>}
            <div className="form-group"><label className="label">Your Price (EGP) *</label>
              <input className="input" type="number" value={price} onChange={e=>setPrice(e.target.value)} placeholder="e.g. 3000"/>
              {price&&<div style={{fontSize:10,color:"rgba(255,255,255,0.3)",marginTop:6,lineHeight:1.6}}>
                Xairod commission ({biz?.commission_rate||12}%): {Math.round(parseFloat(price||0)*(biz?.commission_rate||12)/100)} EGP<br/>
                <strong style={{color:"#4DD994"}}>You receive: {Math.round(parseFloat(price||0)*(1-(biz?.commission_rate||12)/100))} EGP</strong>
              </div>}
            </div>
            <div className="form-group"><label className="label">Timeline *</label>
              <input className="input" value={timeline} onChange={e=>setTimeline(e.target.value)} placeholder="e.g. 5–7 business days"/></div>
            <div className="form-group"><label className="label">Notes (optional)</label>
              <textarea className="input" rows={3} value={quoteNote} onChange={e=>setQuoteNote(e.target.value)} placeholder="What's included?"/></div>
            <div style={{display:"flex",gap:10}}>
              <button className="btn-outline" onClick={()=>setQuoteModal(null)} style={{flex:1}}>Cancel</button>
              <button className="btn-primary" onClick={submitQuote} disabled={loading} style={{flex:2}}>{loading?"Sending…":"Send Quote →"}</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── BOOKINGS ──────────────────────────────────────────────────────────────────
function BookingsScreen({biz,bookings,onUpdate}){
  const[loading,setLoading]=useState(null);

  const markComplete=async(booking)=>{
    setLoading(booking.id);
    const code="XR-CONF-"+Math.floor(100000+Math.random()*900000);
    await sb.from("bookings").update({status:"awaiting_confirmation",confirmation_code:code,completed_at:new Date().toISOString()}).eq("id",booking.id);
    await sb.from("notifications").insert({
      user_id:booking.user_id,icon:"🎉",
      message:`${biz.name} completed your service! Enter code ${code} to confirm and release payment.`,
      type:"completion",metadata:{confirmation_code:code}
    }).catch(()=>{});
    onUpdate();setLoading(null);
  };

  return(
    <div className="content">
      <div style={{fontFamily:"'Fraunces',serif",fontSize:22,fontWeight:900,color:"#FEFCF7",marginBottom:4}}>Bookings</div>
      <div style={{fontSize:11,color:"rgba(255,255,255,0.3)",marginBottom:20}}>{bookings.length} total</div>
      {bookings.length===0?(
        <div className="empty-state">
          <div style={{fontSize:48,marginBottom:14}}>📋</div>
          <div style={{fontFamily:"'Fraunces',serif",fontSize:18,fontWeight:800,color:"rgba(255,255,255,0.5)",marginBottom:6}}>No bookings yet</div>
          <div style={{fontSize:13}}>When a user accepts your quote, the booking appears here. Mark it complete to generate a confirmation code and release payment.</div>
        </div>
      ):bookings.map(b=>(
        <div key={b.id} className="request-card">
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}>
            <span className="ref-tag">{b.ref||b.id?.slice(0,8)}</span>
            <span className={`badge-pill badge-${b.status==="completed"?"completed":b.status==="in_progress"?"progress":"quoted"}`}>{b.status?.replace("_"," ")}</span>
          </div>
          <div style={{fontSize:13,fontWeight:600,color:"#FEFCF7",marginBottom:10}}>{b.service_description||"Booking"}</div>
          <div style={{background:"rgba(255,255,255,0.03)",borderRadius:8,padding:"10px 12px",marginBottom:12}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}>
              <div style={{fontSize:10,color:"rgba(255,255,255,0.35)"}}>Gross amount</div>
              <div style={{fontSize:11,fontWeight:700,color:"#FEFCF7"}}>{(b.gross_amount||0).toLocaleString()} EGP</div>
            </div>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}>
              <div style={{fontSize:10,color:"rgba(255,255,255,0.35)"}}>Xairod commission ({b.commission_rate||12}%)</div>
              <div style={{fontSize:11,color:"#C0392B"}}>- {(b.commission_amount||0).toLocaleString()} EGP</div>
            </div>
            <div style={{height:1,background:"rgba(255,255,255,0.06)",margin:"6px 0"}}/>
            <div style={{display:"flex",justifyContent:"space-between"}}>
              <div style={{fontSize:10,fontWeight:700,color:"rgba(255,255,255,0.5)"}}>Your payout</div>
              <div style={{fontSize:13,fontWeight:800,color:"#4DD994"}}>{(b.payout_amount||0).toLocaleString()} EGP</div>
            </div>
          </div>
          {b.status==="in_progress"&&(
            <button onClick={()=>markComplete(b)} disabled={loading===b.id} className="btn-primary" style={{width:"100%",padding:10}}>
              {loading===b.id?"Generating code…":"✅ Mark Complete → Generate Confirmation Code"}
            </button>
          )}
          {b.status==="awaiting_confirmation"&&(
            <div style={{background:"rgba(200,134,26,0.1)",border:"1px solid rgba(200,134,26,0.2)",borderRadius:8,padding:"10px 12px"}}>
              <div style={{fontSize:10,fontWeight:700,color:"#F5C550",marginBottom:4}}>⏳ Awaiting User Confirmation</div>
              <div style={{fontSize:11,color:"rgba(255,255,255,0.4)"}}>Code sent to user: <strong style={{color:"#F5C550"}}>{b.confirmation_code}</strong></div>
            </div>
          )}
          {b.status==="completed"&&(
            <div style={{background:"rgba(77,217,148,0.08)",border:"1px solid rgba(77,217,148,0.15)",borderRadius:8,padding:"10px 12px"}}>
              <div style={{fontSize:11,fontWeight:700,color:"#4DD994"}}>✓ Completed · Payout queued</div>
            </div>
          )}
        </div>
      ))}
    </div>
  );
}

// ── LISTING ───────────────────────────────────────────────────────────────────
function ListingScreen({biz,onUpdate}){
  const[form,setForm]=useState({name:biz?.name||"",city:biz?.city||"",phone:biz?.phone||"",description:biz?.description||""});
  const[saving,setSaving]=useState(false);
  const[saved,setSaved]=useState(false);

  const save=async()=>{
    setSaving(true);
    await sb.from("business_accounts").update(form).eq("id",biz.id);
    if(biz.listing_id) await sb.from("listings").update({name:form.name,city:form.city,phone:form.phone,description:form.description}).eq("id",biz.listing_id);
    setSaving(false);setSaved(true);setTimeout(()=>setSaved(false),3000);onUpdate();
  };

  return(
    <div className="content">
      <div style={{fontFamily:"'Fraunces',serif",fontSize:22,fontWeight:900,color:"#FEFCF7",marginBottom:20}}>My Listing</div>
      {biz?.status==="pending"&&<div className="alert alert-warn" style={{marginBottom:16}}>⏳ Your listing is under review and will go live within 24 hours.</div>}
      {biz?.status==="active"&&<div className="alert alert-success" style={{marginBottom:16}}>✓ Your listing is live on xairod.com</div>}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:20}}>
        <div className="card">
          <div style={{fontSize:12,fontWeight:800,color:"rgba(255,255,255,0.4)",textTransform:"uppercase",letterSpacing:1,marginBottom:16}}>Business Details</div>
          {[
            {label:"Business Name",key:"name",placeholder:"Your business name"},
            {label:"City / Location",key:"city",placeholder:"Cairo, Egypt"},
            {label:"WhatsApp Number",key:"phone",placeholder:"+20 100 000 0000"},
          ].map(f=>(
            <div key={f.key} className="form-group"><label className="label">{f.label}</label>
              <input className="input" value={form[f.key]} onChange={e=>setForm({...form,[f.key]:e.target.value})} placeholder={f.placeholder}/></div>
          ))}
          <div className="form-group"><label className="label">Description</label>
            <textarea className="input" rows={4} value={form.description} onChange={e=>setForm({...form,description:e.target.value})}/></div>
          {saved&&<div className="alert alert-success">✓ Saved successfully</div>}
          <button className="btn-primary" onClick={save} disabled={saving} style={{width:"100%"}}>{saving?"Saving…":"Save Changes"}</button>
        </div>
        <div>
          <div className="card">
            <div style={{fontSize:12,fontWeight:800,color:"rgba(255,255,255,0.4)",textTransform:"uppercase",letterSpacing:1,marginBottom:14}}>Account Info</div>
            {[
              ["Category",biz?.category_label||biz?.category||"—"],
              ["Commission Rate",`${biz?.commission_rate||12}% per completed deal`],
              ["Status",biz?.status==="active"?"✓ Active":"⏳ Pending Review"],
              ["Member Since",biz?.created_at?new Date(biz.created_at).toLocaleDateString():"—"],
            ].map(([k,v])=>(
              <div key={k} style={{display:"flex",justifyContent:"space-between",padding:"10px 0",borderBottom:"1px solid rgba(255,255,255,0.05)"}}>
                <div style={{fontSize:11,color:"rgba(255,255,255,0.35)"}}>{k}</div>
                <div style={{fontSize:11,fontWeight:700,color:"#FEFCF7"}}>{v}</div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

// ── MAIN APP ──────────────────────────────────────────────────────────────────
function App(){
  const[authUser,setAuthUser]=useState(null);
  const[biz,setBiz]=useState(null);
  const[page,setPage]=useState("dashboard");
  const[requests,setRequests]=useState([]);
  const[bookings,setBookings]=useState([]);
  const[loading,setLoading]=useState(true);

  useEffect(()=>{
    sb.auth.getSession().then(async({data:{session}})=>{
      if(session?.user){
        const{data:bizData}=await sb.from("business_accounts").select("*").eq("user_id",session.user.id).single();
        if(bizData){setAuthUser(session.user);setBiz(bizData);await loadData(bizData.id);}
      }
      setLoading(false);
    });
  },[]);

  const loadData=async(bizId)=>{
    const{data:reqs}=await sb.from("service_requests").select("*").eq("assigned_business_id",bizId).order("created_at",{ascending:false});
    setRequests(reqs||[]);
    const{data:bks}=await sb.from("bookings").select("*").eq("business_id",bizId).order("created_at",{ascending:false});
    setBookings(bks||[]);
  };

  const signOut=async()=>{await sb.auth.signOut();setAuthUser(null);setBiz(null);setRequests([]);setBookings([]);};

  const handleAuth=(user,bizData)=>{setAuthUser(user);setBiz(bizData);loadData(bizData.id);};

  if(loading)return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{textAlign:"center"}}>
        <div style={{fontFamily:"'Fraunces',serif",fontSize:32,fontWeight:900,color:"#4DD994",marginBottom:12}}>Xairod.</div>
        <div style={{fontSize:12,color:"rgba(255,255,255,0.3)"}}>Loading your business portal…</div>
      </div>
    </div>
  );

  if(!authUser||!biz)return <AuthScreen onAuth={handleAuth}/>;

  const newLeads=requests.filter(r=>r.status==="open").length;

  return(
    <div style={{display:"flex"}}>
      <Sidebar page={page} setPage={setPage} biz={biz} newLeads={newLeads} onSignOut={signOut}/>
      <div className="main-wrap">
        <div className="topbar">
          <div>
            <div style={{fontFamily:"'Fraunces',serif",fontSize:18,fontWeight:800,color:"#FEFCF7"}}>
              {page.charAt(0).toUpperCase()+page.slice(1)}
            </div>
            <div style={{fontSize:10,color:"rgba(255,255,255,0.25)",marginTop:1}}>{new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</div>
          </div>
          <div style={{fontSize:11,color:"rgba(255,255,255,0.3)"}}>{biz.name}</div>
        </div>
        {page==="dashboard"&&<Dashboard biz={biz} requests={requests} bookings={bookings} setPage={setPage}/>}
        {page==="requests"&&<RequestsScreen biz={biz} requests={requests} onUpdate={()=>loadData(biz.id)}/>}
        {page==="bookings"&&<BookingsScreen biz={biz} bookings={bookings} onUpdate={()=>loadData(biz.id)}/>}
        {page==="payouts"&&<PayoutsScreen biz={biz} bookings={bookings}/>}
        {page==="listing"&&<ListingScreen biz={biz} onUpdate={()=>loadData(biz.id)}/>}
        {page==="settings"&&(
          <div className="content">
            <div style={{fontFamily:"'Fraunces',serif",fontSize:22,fontWeight:900,color:"#FEFCF7",marginBottom:20}}>Settings</div>
            <div className="card">
              <div style={{fontSize:12,color:"rgba(255,255,255,0.4)",lineHeight:1.7}}>
                For support, contact <span style={{color:"#4DD994"}}>hello@xairod.com</span> or message <span style={{color:"#4DD994"}}>t.me/ckairod</span>
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
