<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Xairod Business Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Outfit',sans-serif;background:#0D0A05;color:#FEFCF7;min-height:100vh;}
.layout{display:flex;min-height:100vh;}
.sidebar{width:220px;background:#141008;border-right:1px solid rgba(255,255,255,0.06);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:100;transition:transform 0.25s;}
.sidebar-logo{padding:20px 18px;border-bottom:1px solid rgba(255,255,255,0.06);}
.logo-text{font-family:'Fraunces',serif;font-size:22px;font-weight:900;color:#FEFCF7;}
.logo-text .x{color:#4DD994;}.logo-text .d{color:#C8861A;}
.nav{flex:1;padding:12px 0;}
.nav-item{width:100%;display:flex;align-items:center;gap:10px;padding:10px 18px;background:none;border:none;color:rgba(255,255,255,0.5);font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;cursor:pointer;text-align:left;border-radius:0;transition:all 0.15s;}
.nav-item:hover{background:rgba(255,255,255,0.04);color:#FEFCF7;}
.nav-item.active{background:rgba(77,217,148,0.08);color:#4DD994;border-right:2px solid #4DD994;}
.nav-icon{font-size:16px;width:20px;text-align:center;}
.badge{background:#C0392B;color:white;font-size:9px;font-weight:800;padding:2px 6px;border-radius:10px;margin-left:auto;}
.main{margin-left:220px;flex:1;min-height:100vh;}
.topbar{padding:14px 28px;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:space-between;background:#141008;position:sticky;top:0;z-index:50;}
.page-title{font-family:'Fraunces',serif;font-size:18px;font-weight:800;}
.content{padding:24px 28px 48px;}
.card{background:#141008;border:1px solid rgba(255,255,255,0.07);border-radius:14px;padding:20px;margin-bottom:16px;}
.card-title{font-size:12px;font-weight:800;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:1px;margin-bottom:16px;}
.input{width:100%;padding:10px 13px;border-radius:10px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:#FEFCF7;font-family:'Outfit',sans-serif;font-size:13px;outline:none;}
.input::placeholder{color:rgba(255,255,255,0.25);}
.input:focus{border-color:#4DD994;}
select.input option{background:#1a1510;color:#FEFCF7;}
.label{font-size:11px;font-weight:700;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:0.7px;display:block;margin-bottom:5px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
.form-group{margin-bottom:12px;}
.btn-primary{background:#4DD994;color:#03311A;border:none;padding:11px 22px;border-radius:10px;font-family:'Outfit',sans-serif;font-weight:800;font-size:13px;cursor:pointer;}
.btn-outline{background:transparent;color:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.15);padding:8px 16px;border-radius:9px;font-family:'Outfit',sans-serif;font-weight:700;font-size:12px;cursor:pointer;}
.btn-danger{background:rgba(192,57,43,0.15);color:#E74C3C;border:1px solid rgba(192,57,43,0.25);padding:5px 12px;border-radius:7px;font-family:'Outfit',sans-serif;font-weight:700;font-size:11px;cursor:pointer;}
.alert{padding:12px 16px;border-radius:10px;font-size:12px;font-weight:600;margin-bottom:16px;}
.alert-warn{background:rgba(200,134,26,0.1);border:1px solid rgba(200,134,26,0.2);color:#F5C550;}
.alert-success{background:rgba(77,217,148,0.08);border:1px solid rgba(77,217,148,0.15);color:#4DD994;}
.alert-error{background:rgba(192,57,43,0.08);border:1px solid rgba(192,57,43,0.15);color:#E74C3C;}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;}
.pill-green{background:rgba(77,217,148,0.15);color:#4DD994;}
.pill-gold{background:rgba(200,134,26,0.15);color:#F5C550;}
.pill-red{background:rgba(192,57,43,0.15);color:#E74C3C;}
.pill-gray{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.4);}
table{width:100%;border-collapse:collapse;font-size:12px;}
th{text-align:left;padding:8px 12px;color:rgba(255,255,255,0.3);font-size:10px;font-weight:700;text-transform:uppercase;border-bottom:1px solid rgba(255,255,255,0.06);}
td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,0.04);vertical-align:middle;}
.empty{text-align:center;padding:48px 0;}
.empty-icon{font-size:48px;margin-bottom:12px;}
.empty-title{font-family:'Fraunces',serif;font-size:18px;font-weight:800;color:rgba(255,255,255,0.3);margin-bottom:6px;}
.empty-sub{font-size:12px;color:rgba(255,255,255,0.2);}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:#1a1510;border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:24px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;}
.modal-title{font-family:'Fraunces',serif;font-size:18px;font-weight:800;margin-bottom:16px;}
/* Auth */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0D0A05;padding:24px;}
.auth-box{background:#141008;border:1px solid rgba(255,255,255,0.07);border-radius:20px;padding:32px;width:100%;max-width:440px;}
.auth-logo{font-family:'Fraunces',serif;font-size:28px;font-weight:900;margin-bottom:4px;}
.steps{display:flex;gap:8px;margin-bottom:24px;}
.step{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,0.1);}
.step.done{background:#4DD994;}
.step.active{background:#C8861A;}
/* Mobile */
.mob-bar{display:none;background:#141008;padding:12px 16px;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,0.06);position:fixed;top:0;left:0;right:0;z-index:150;}
.overlay-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:99;}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .overlay-bg.open{display:block;}
  .main{margin-left:0;}
  .mob-bar{display:flex;}
  .topbar{padding-top:60px;}
  .content{padding:16px 16px 80px;}
  .form-row{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const S = React;
const {useState, useEffect, useRef} = S;
const SUPA_URL = "https://gfvsosvszxwazuqnsavq.supabase.co";
const SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdmdnNvc3Zzenh3YXp1cW5zYXZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwODcxNjAsImV4cCI6MjA5MzY2MzE2MH0.SvSc1IDr_iK8YweQpKarmglQTPV7w2dNkKcbFim_Ztc";
const sb = supabase.createClient(SUPA_URL, SUPA_KEY);
const { useState, useEffect, useRef } = React;

// ── UTILS ─────────────────────────────────────────────────────────────────────
const CATS = {health:"Health",food:"Food & Restaurants",travel:"Tourism & Travel",housing:"Housing",school:"Schools & Agencies",agency:"Admission Agency",language:"Language School"};
const fmt = n => (n||0).toLocaleString();
function Toast({msg,type,onDone}){
  useEffect(()=>{const t=setTimeout(onDone,3000);return()=>clearTimeout(t);},[]);
  return <div className={"alert alert-"+(type==="error"?"error":type==="warn"?"warn":"success")} style={{position:"fixed",top:16,right:16,zIndex:999,maxWidth:320,boxShadow:"0 4px 20px rgba(0,0,0,0.3)"}}>{msg}</div>;
}

// ── AUTH / REGISTER ───────────────────────────────────────────────────────────
function AuthScreen({onAuth}){
  const[mode,setMode]=useState("login"); // login | register
  const[step,setStep]=useState(1);
  const[email,setEmail]=useState("");
  const[pass,setPass]=useState("");
  const[bizName,setBizName]=useState("");
  const[bizCat,setBizCat]=useState("health");
  const[bizCity,setBizCity]=useState("");
  const[bizDesc,setBizDesc]=useState("");
  const[docs,setDocs]=useState([]);
  const[agreed,setAgreed]=useState(false);
  const[err,setErr]=useState("");
  const[loading,setLoading]=useState(false);

  const login=async()=>{
    if(!email||!pass){setErr("Enter email and password.");return;}
    setLoading(true);setErr("");
    const{error}=await sb.auth.signInWithPassword({email,password:pass});
    if(error){setErr(error.message);setLoading(false);return;}
    const{data:rows}=await sb.from("business_accounts").select("*").eq("user_id",(await sb.auth.getUser()).data.user.id).limit(1);
    if(rows?.[0]) onAuth(rows[0]);
    else{setErr("No business account found for this email.");await sb.auth.signOut();}
    setLoading(false);
  };

  const register=async()=>{
    if(!agreed){setErr("Please agree to the terms.");return;}
    setLoading(true);setErr("");
    try{
      let userId;
      const existing=await sb.auth.getUser();
      if(existing.data.user){userId=existing.data.user.id;}
      else{
        const{data,error:signErr}=await sb.auth.signUp({email,password:pass});
        if(signErr)throw signErr;
        userId=data.user.id;
      }
      const{data:biz,error:bizErr}=await sb.from("business_accounts").insert({
        user_id:userId,name:bizName,email,category:bizCat,city:bizCity,
        description:bizDesc,status:"pending",kyc_status:"submitted",
        commission_rate:12
      }).select().single();
      if(bizErr)throw bizErr;
      // Upload docs
      for(const doc of docs){
        const path=`kyc/${biz.id}/${Date.now()}_${doc.name}`;
        await sb.storage.from("kyc-documents").upload(path,doc);
        await sb.from("kyc_documents").insert({business_id:biz.id,document_type:doc.name,file_path:path,status:"pending"});
      }
      onAuth(biz);
    }catch(e){setErr(e.message);}
    setLoading(false);
  };

  if(mode==="login") return(
    <div className="auth-wrap">
      <div className="auth-box">
        <div className="auth-logo"><span className="x" style={{color:"#4DD994"}}>X</span>airod<span style={{color:"#C8861A"}}>.</span></div>
        <p style={{fontSize:12,color:"rgba(255,255,255,0.3)",marginBottom:24}}>Business Portal</p>
        <div className="form-group"><label className="label">Email</label><input className="input" type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@business.com"/></div>
        <div className="form-group"><label className="label">Password</label><input className="input" type="password" value={pass} onChange={e=>setPass(e.target.value)} placeholder="••••••••"/></div>
        {err&&<div className="alert alert-error">{err}</div>}
        <button className="btn-primary" style={{width:"100%",marginBottom:12}} onClick={login} disabled={loading}>{loading?"Signing in…":"Sign In →"}</button>
        <p style={{fontSize:12,color:"rgba(255,255,255,0.3)",textAlign:"center"}}>New business? <button onClick={()=>setMode("register")} style={{background:"none",border:"none",color:"#4DD994",cursor:"pointer",fontFamily:"'Outfit',sans-serif",fontSize:12,fontWeight:700}}>Register here</button></p>
      </div>
    </div>
  );

  return(
    <div className="auth-wrap">
      <div className="auth-box" style={{maxWidth:520}}>
        <div className="auth-logo"><span style={{color:"#4DD994"}}>X</span>airod<span style={{color:"#C8861A"}}>.</span></div>
        <p style={{fontSize:12,color:"rgba(255,255,255,0.3)",marginBottom:16}}>Partner Registration</p>
        <div className="steps">
          {[1,2,3].map(n=><div key={n} className={"step"+(step>n?" done":step===n?" active":"")}/>)}
        </div>

        {step===1&&<>
          <p style={{fontSize:13,fontWeight:700,color:"rgba(255,255,255,0.5)",marginBottom:16}}>Step 1 — Account & Business Info</p>
          <div className="form-row">
            <div className="form-group"><label className="label">Email *</label><input className="input" type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="business@email.com"/></div>
            <div className="form-group"><label className="label">Password *</label><input className="input" type="password" value={pass} onChange={e=>setPass(e.target.value)} placeholder="Min 8 characters"/></div>
          </div>
          <div className="form-group"><label className="label">Business Name *</label><input className="input" value={bizName} onChange={e=>setBizName(e.target.value)} placeholder="Your business name"/></div>
          <div className="form-row">
            <div className="form-group"><label className="label">Category *</label>
              <select className="input" value={bizCat} onChange={e=>setBizCat(e.target.value)}>
                {Object.entries(CATS).map(([k,v])=><option key={k} value={k}>{v}</option>)}
              </select>
            </div>
            <div className="form-group"><label className="label">City *</label><input className="input" value={bizCity} onChange={e=>setBizCity(e.target.value)} placeholder="Cairo, Egypt"/></div>
          </div>
          <div className="form-group"><label className="label">Description</label><textarea className="input" rows={3} value={bizDesc} onChange={e=>setBizDesc(e.target.value)} placeholder="What do you offer?"/></div>
          {err&&<div className="alert alert-error">{err}</div>}
          <button className="btn-primary" onClick={()=>{if(!email||!pass||!bizName||!bizCity){setErr("Fill all required fields.");return;}setErr("");setStep(2);}} style={{width:"100%"}}>Next →</button>
        </>}

        {step===2&&<>
          <p style={{fontSize:13,fontWeight:700,color:"rgba(255,255,255,0.5)",marginBottom:16}}>Step 2 — KYC Documents</p>
          <div className="alert alert-warn">Upload your business registration, valid ID, and any professional licence. Documents are reviewed within 24 hours.</div>
          <div className="form-group">
            <label className="label">Upload Documents *</label>
            <input type="file" multiple accept=".pdf,.jpg,.jpeg,.png" onChange={e=>setDocs(Array.from(e.target.files))}
              style={{color:"rgba(255,255,255,0.5)",fontSize:12}}/>
            {docs.length>0&&<p style={{fontSize:11,color:"#4DD994",marginTop:6}}>✓ {docs.length} file(s) selected</p>}
          </div>
          <div style={{display:"flex",gap:10}}>
            <button className="btn-outline" onClick={()=>setStep(1)} style={{flex:1}}>← Back</button>
            <button className="btn-primary" onClick={()=>{if(!docs.length){setErr("Upload at least one document.");return;}setErr("");setStep(3);}} style={{flex:2}}>Next →</button>
          </div>
          {err&&<div className="alert alert-error" style={{marginTop:12}}>{err}</div>}
        </>}

        {step===3&&<>
          <p style={{fontSize:13,fontWeight:700,color:"rgba(255,255,255,0.5)",marginBottom:16}}>Step 3 — Review & Submit</p>
          <div className="card">
            <div style={{fontSize:12,color:"rgba(255,255,255,0.4)",lineHeight:1.8}}>
              <div><strong style={{color:"#FEFCF7"}}>Business:</strong> {bizName}</div>
              <div><strong style={{color:"#FEFCF7"}}>Category:</strong> {CATS[bizCat]}</div>
              <div><strong style={{color:"#FEFCF7"}}>City:</strong> {bizCity}</div>
              <div><strong style={{color:"#FEFCF7"}}>Documents:</strong> {docs.length} files</div>
            </div>
          </div>
          <div style={{display:"flex",gap:10,alignItems:"flex-start",marginBottom:16}}>
            <input type="checkbox" id="agree" checked={agreed} onChange={e=>setAgreed(e.target.checked)} style={{marginTop:3}}/>
            <label htmlFor="agree" style={{fontSize:12,color:"rgba(255,255,255,0.4)",lineHeight:1.6,cursor:"pointer"}}>
              I agree to the <a href="https://www.xairod.com/terms" target="_blank" style={{color:"#4DD994"}}>Terms & Conditions</a> and confirm all information is accurate.
            </label>
          </div>
          {err&&<div className="alert alert-error">{err}</div>}
          <div style={{display:"flex",gap:10}}>
            <button className="btn-outline" onClick={()=>setStep(2)} style={{flex:1}}>← Back</button>
            <button className="btn-primary" onClick={register} disabled={loading||!agreed} style={{flex:2}}>{loading?"Submitting…":"Submit Application →"}</button>
          </div>
        </>}

        <p style={{fontSize:12,color:"rgba(255,255,255,0.3)",textAlign:"center",marginTop:16}}>Already registered? <button onClick={()=>setMode("login")} style={{background:"none",border:"none",color:"#4DD994",cursor:"pointer",fontFamily:"'Outfit',sans-serif",fontSize:12,fontWeight:700}}>Sign in</button></p>
      </div>
    </div>
  );
}

// ── SCREENS ───────────────────────────────────────────────────────────────────
function DashboardScreen({biz,requests,bookings,setPage}){
  const pending=requests.filter(r=>r.status==="open").length;
  const inProg=bookings.filter(b=>b.status==="in_progress").length;
  const earned=bookings.filter(b=>b.payment_status==="paid").reduce((s,b)=>s+(b.payout_amount||0),0);
  return(
    <div>
      {biz.status==="pending"&&<div className="alert alert-warn">⏳ Account under review — expected approval within 24 hours. You can upload photos and add services while you wait.</div>}
      {biz.status==="active"&&<div className="alert alert-success">✓ Your listing is live on xairod.com</div>}
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:14,marginBottom:20}}>
        {[["📥","New Requests",pending,"requests"],["✅","Active Jobs",inProg,"bookings"],["💰","Total Earned",fmt(earned)+" NGN","payouts"]].map(([icon,label,val,page])=>(
          <div key={label} onClick={()=>setPage(page)} style={{background:"#141008",border:"1px solid rgba(255,255,255,0.07)",borderRadius:14,padding:18,cursor:"pointer"}}>
            <div style={{fontSize:24,marginBottom:8}}>{icon}</div>
            <div style={{fontFamily:"'Fraunces',serif",fontSize:22,fontWeight:900,color:"#4DD994"}}>{val}</div>
            <div style={{fontSize:11,color:"rgba(255,255,255,0.3)",marginTop:2}}>{label}</div>
          </div>
        ))}
      </div>
      <div className="card">
        <div className="card-title">⚡ Complete Your Profile</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          {[["📸","Add Photos","Upload business images","listing"],["🛎️","Add Services","List prices","services"],["🕐","Set Hours","Availability","availability"],["💳","Bank Account","Get paid","payouts"]].map(([icon,title,sub,pg])=>(
            <button key={pg} onClick={()=>setPage(pg)} style={{background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:10,padding:"14px 12px",textAlign:"left",cursor:"pointer"}}>
              <div style={{fontSize:20,marginBottom:6}}>{icon}</div>
              <div style={{fontSize:12,fontWeight:700,color:"#FEFCF7",marginBottom:2}}>{title}</div>
              <div style={{fontSize:10,color:"rgba(255,255,255,0.3)"}}>{sub}</div>
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

function RequestsScreen({biz,requests,onUpdate}){
  const[quoteModal,setQuoteModal]=useState(null);
  const[price,setPrice]=useState("");
  const[timeline,setTimeline]=useState("");
  const[note,setNote]=useState("");
  const[saving,setSaving]=useState(false);
  const[err,setErr]=useState("");
  const[toast,setToast]=useState(null);

  const sendQuote=async()=>{
    if(!price||!timeline){setErr("Price and timeline required.");return;}
    setSaving(true);setErr("");
    const gross=parseFloat(price);
    const comm=Math.round(gross*(biz.commission_rate||12)/100);
    await sb.from("quotes").insert({request_id:quoteModal.id,business_id:biz.id,price:gross,commission_rate:biz.commission_rate||12,commission_amount:comm,payout_amount:gross-comm,timeline,notes:note,status:"pending"});
    await sb.from("service_requests").update({status:"quoted"}).eq("id",quoteModal.id);
    // Notify user
    sb.from("notifications").insert({user_id:quoteModal.user_id,icon:"💬",message:`${biz.name} sent you a quote of ${fmt(gross)} NGN for request ${quoteModal.ref||""}. Go to My Requests to accept.`,type:"quote",metadata:{request_id:quoteModal.id}});
    setToast({msg:"Quote sent!",type:"success"});
    setQuoteModal(null);setPrice("");setTimeline("");setNote("");
    setSaving(false);onUpdate();
  };

  return(
    <div>
      {toast&&<Toast msg={toast.msg} type={toast.type} onDone={()=>setToast(null)}/>}
      {requests.length===0?(
        <div className="empty"><div className="empty-icon">📥</div><div className="empty-title">No requests yet</div><div className="empty-sub">When users send bookings they'll appear here</div></div>
      ):(
        <div>
          {requests.map(req=>(
            <div key={req.id} className="card" style={{borderLeft:`4px solid ${req.status==="in_progress"?"#4DD994":req.status==="quoted"?"#F5C550":"#888"}`}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
                <div>
                  <div style={{fontSize:13,fontWeight:700,color:"#FEFCF7",marginBottom:2}}>{req.listing_name||"Service Request"}</div>
                  <div style={{fontSize:10,color:"rgba(255,255,255,0.3)"}}>Ref: {req.ref||req.id?.slice(0,8)} · {new Date(req.created_at).toLocaleDateString()}</div>
                </div>
                <span className={"pill pill-"+(req.status==="in_progress"?"green":req.status==="quoted"?"gold":"gray")}>{req.status||"open"}</span>
              </div>
              <div style={{fontSize:12,color:"rgba(255,255,255,0.5)",lineHeight:1.6,marginBottom:10}}>{req.what_i_need?.slice(0,150)}</div>

function ServicesScreen({biz}){
  const[services,setServices]=useState([]);
  const[showAdd,setShowAdd]=useState(false);
  const[form,setForm]=useState({name:"",description:"",price:"",currency:"NGN",duration_mins:60});
  const[saving,setSaving]=useState(false);
  const[toast,setToast]=useState(null);

  useEffect(()=>{
    if(!biz?.id) return;
    sb.from("services").select("*").eq("business_id",biz.id).order("created_at",{ascending:false}).then(({data})=>{if(data)setServices(data);});
  },[biz?.id]);

  const add=async()=>{
    if(!form.name||!form.price){return;}
    setSaving(true);
    const{data}=await sb.from("services").insert({business_id:biz.id,listing_id:biz.listing_id||null,...form,price:parseFloat(form.price),duration_mins:parseInt(form.duration_mins),available:true}).select().single();
    if(data){
      setServices(p=>[data,...p]);
      if(biz.listing_id){
        const allSvcs=[data,...services].map(s=>({name:s.name,price:s.price,currency:s.currency,duration_mins:s.duration_mins}));
        sb.from("listings").update({services:allSvcs}).eq("id",biz.listing_id);
      }
    }
    setForm({name:"",description:"",price:"",currency:"NGN",duration_mins:60});
    setShowAdd(false);setSaving(false);setToast({msg:"Service added — live on Xairod",type:"success"});
  };

  const toggle=async(svc)=>{
    await sb.from("services").update({available:!svc.available}).eq("id",svc.id);
    setServices(p=>p.map(s=>s.id===svc.id?{...s,available:!s.available}:s));
  };

  const del=async(id)=>{
    if(!window.confirm("Delete this service?")) return;
    await sb.from("services").delete().eq("id",id);
    setServices(p=>p.filter(s=>s.id!==id));
  };

  return(
    <div>
      {toast&&<Toast msg={toast.msg} type={toast.type} onDone={()=>setToast(null)}/>}

      </div>
      {services.length===0?(
        <div className="empty"><div className="empty-icon">🛎️</div><div className="empty-title">No services yet</div><div className="empty-sub">Add your services with prices</div></div>
      ):services.map(svc=>(
        <div key={svc.id} className="card" style={{display:"flex",alignItems:"center",gap:12}}>
          <div style={{flex:1}}>
            <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:3}}>
              <span style={{fontSize:13,fontWeight:700,color:"#FEFCF7"}}>{svc.name}</span>
              <span className={"pill pill-"+(svc.available?"green":"gray")}>{svc.available?"Live":"Hidden"}</span>
            </div>
            {svc.description&&<div style={{fontSize:11,color:"rgba(255,255,255,0.35)",marginBottom:4}}>{svc.description}</div>}
            <span style={{fontFamily:"'Fraunces',serif",fontSize:16,fontWeight:900,color:"#4DD994"}}>{fmt(svc.price)} {svc.currency}</span>
            {svc.duration_mins>0&&<span style={{fontSize:10,color:"rgba(255,255,255,0.3)",marginLeft:8}}>· {svc.duration_mins<60?svc.duration_mins+"min":Math.floor(svc.duration_mins/60)+"h"}</span>}
          </div>
          <div style={{display:"flex",gap:6}}>
            <button className="btn-outline" style={{fontSize:10,padding:"4px 10px"}} onClick={()=>toggle(svc)}>{svc.available?"Hide":"Show"}</button>
            <button className="btn-danger" onClick={()=>del(svc.id)}>Delete</button>
          </div>
        </div>
      ))}
      {showAdd&&(
        <div className="overlay">
          <div className="modal">
            <div className="modal-title">Add Service</div>
            <div className="form-group"><label className="label">Service Name *</label><input className="input" value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="e.g. Full Admission Package"/></div>

            <div className="form-row">
              <div className="form-group"><label className="label">Price *</label><input className="input" type="number" value={form.price} onChange={e=>setForm({...form,price:e.target.value})} placeholder="50000"/></div>
              <div className="form-group"><label className="label">Currency</label>
                <select className="input" value={form.currency} onChange={e=>setForm({...form,currency:e.target.value})}>
                  <option value="NGN">NGN (₦)</option><option value="EGP">EGP</option><option value="USD">USD</option>
                </select>
              </div>
            </div>
            <div className="form-group"><label className="label">Duration</label>
              <select className="input" value={form.duration_mins} onChange={e=>setForm({...form,duration_mins:e.target.value})}>

          </div>
        </div>

  );
}

function AvailabilityScreen({biz}){
  const DAYS=[{k:"mon",l:"Monday"},{k:"tue",l:"Tuesday"},{k:"wed",l:"Wednesday"},{k:"thu",l:"Thursday"},{k:"fri",l:"Friday"},{k:"sat",l:"Saturday"},{k:"sun",l:"Sunday"}];
  const DEF={mon:{open:true,from:"09:00",to:"17:00"},tue:{open:true,from:"09:00",to:"17:00"},wed:{open:true,from:"09:00",to:"17:00"},thu:{open:true,from:"09:00",to:"17:00"},fri:{open:true,from:"09:00",to:"17:00"},sat:{open:false,from:"10:00",to:"14:00"},sun:{open:false,from:"10:00",to:"14:00"}};
  const[hours,setHours]=useState(DEF);
  const[blocked,setBlocked]=useState([]);
  const[newBlock,setNewBlock]=useState("");
  const[saved,setSaved]=useState(false);
  const[toast,setToast]=useState(null);

  useEffect(()=>{
    if(!biz?.id) return;
    if(biz.listing_id) sb.from("listings").select("opening_hours").eq("id",biz.listing_id).single().then(({data})=>{if(data?.opening_hours&&Object.keys(data.opening_hours).length>0)setHours(data.opening_hours);});
    sb.from("booking_slots").select("slot_date").eq("business_id",biz.id).eq("is_blocked",true).then(({data})=>{if(data)setBlocked(data.map(d=>d.slot_date));});
  },[biz?.id]);

  const save=async()=>{
    await sb.from("business_accounts").update({opening_hours:hours}).eq("id",biz.id);
    if(biz.listing_id) await sb.from("listings").update({opening_hours:hours}).eq("id",biz.listing_id);
    setSaved(true);setTimeout(()=>setSaved(false),2500);
  };

  const blockDate=async()=>{
    if(!newBlock) return;
    await sb.from("booking_slots").insert({business_id:biz.id,slot_date:newBlock,is_blocked:true});
    setBlocked(p=>[...p,newBlock]);setNewBlock("");
  };

  const unblock=async(d)=>{
    await sb.from("booking_slots").delete().eq("business_id",biz.id).eq("slot_date",d).eq("is_blocked",true);
    setBlocked(p=>p.filter(x=>x!==d));
  };

  return(
    <div>
      {toast&&<Toast msg={toast.msg} type={toast.type} onDone={()=>setToast(null)}/>}
      <div className="card">
        <div className="card-title">Opening Hours</div>
        {DAYS.map(day=>(
          <div key={day.k} style={{display:"flex",alignItems:"center",gap:12,marginBottom:10,paddingBottom:10,borderBottom:"1px solid rgba(255,255,255,0.04)"}}>
            <div style={{width:90,fontSize:12,fontWeight:600,color:hours[day.k]?.open?"#FEFCF7":"rgba(255,255,255,0.25)"}}>{day.l}</div>
            <button onClick={()=>setHours(h=>({...h,[day.k]:{...h[day.k],open:!h[day.k]?.open}}))} style={{width:40,height:22,borderRadius:11,background:hours[day.k]?.open?"#4DD994":"rgba(255,255,255,0.1)",border:"none",cursor:"pointer",position:"relative",flexShrink:0}}>
              <div style={{width:16,height:16,borderRadius:"50%",background:"white",position:"absolute",top:3,left:hours[day.k]?.open?21:3,transition:"left 0.2s"}}/>
            </button>
            {hours[day.k]?.open?(
              <div style={{display:"flex",gap:6,alignItems:"center"}}>
                <input type="time" value={hours[day.k]?.from||"09:00"} onChange={e=>setHours(h=>({...h,[day.k]:{...h[day.k],from:e.target.value}}))} style={{background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:6,color:"#FEFCF7",padding:"3px 7px",fontSize:11}}/>
                <span style={{color:"rgba(255,255,255,0.3)",fontSize:11}}>to</span>
                <input type="time" value={hours[day.k]?.to||"17:00"} onChange={e=>setHours(h=>({...h,[day.k]:{...h[day.k],to:e.target.value}}))} style={{background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:6,color:"#FEFCF7",padding:"3px 7px",fontSize:11}}/>
              </div>
            ):<span style={{fontSize:11,color:"rgba(255,255,255,0.25)"}}>Closed</span>}
          </div>
        ))}
        <button className="btn-primary" onClick={save} style={{marginTop:8}}>{saved?"✓ Saved":"Save Hours"}</button>
      </div>
      <div className="card">
        <div className="card-title">Block Dates</div>
        <div style={{display:"flex",gap:10,marginBottom:12}}>
          <input type="date" value={newBlock} onChange={e=>setNewBlock(e.target.value)} className="input" style={{flex:1}}/>
          <button className="btn-primary" onClick={blockDate} disabled={!newBlock}>Block</button>
        </div>
        <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
          {blocked.length===0?<p style={{fontSize:11,color:"rgba(255,255,255,0.2)"}}>No dates blocked</p>:
          blocked.map(d=>(
            <div key={d} style={{background:"rgba(192,57,43,0.1)",border:"1px solid rgba(192,57,43,0.2)",borderRadius:8,padding:"5px 10px",display:"flex",gap:8,alignItems:"center"}}>
              <span style={{fontSize:11,color:"#E74C3C",fontWeight:700}}>{new Date(d+"T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"})}</span>
              <button onClick={()=>unblock(d)} style={{background:"none",border:"none",color:"rgba(255,255,255,0.3)",cursor:"pointer",fontSize:14}}>×</button>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function ListingScreen({biz,onUpdate}){
  const[form,setForm]=useState({name:biz?.name||"",city:biz?.city||"",description:biz?.description||""});
  const[images,setImages]=useState([]);
  const[uploading,setUploading]=useState(false);
  const[saved,setSaved]=useState(false);
  const[toast,setToast]=useState(null);

  useEffect(()=>{
    if(!biz?.id) return;
    const src=biz.listing_id?sb.from("listings").select("images").eq("id",biz.listing_id).single():sb.from("business_accounts").select("images").eq("id",biz.id).single();
    src.then(({data})=>{if(data?.images&&Array.isArray(data.images))setImages(data.images);});
  },[biz?.id,biz?.listing_id]);

  const save=async()=>{
    await sb.from("business_accounts").update({name:form.name,city:form.city,description:form.description}).eq("id",biz.id);
    if(biz.listing_id) await sb.from("listings").update({name:form.name,city:form.city,description:form.description}).eq("id",biz.listing_id);
    setSaved(true);setTimeout(()=>setSaved(false),2500);setToast({msg:"Changes saved and live on Xairod",type:"success"});onUpdate();
  };

  const upload=async(file)=>{
    if(!file) return;
    if(file.size>5*1024*1024){setToast({msg:"Max 5MB per image",type:"error"});return;}
    if(images.length>=6){setToast({msg:"Maximum 6 images",type:"error"});return;}
    setUploading(true);
    const ext=file.name.split(".").pop();
    const fp=`${biz.id}/${Date.now()}.${ext}`;
    const{error}=await sb.storage.from("listing-images").upload(fp,file,{upsert:false});
    if(error){setToast({msg:"Upload failed: "+error.message,type:"error"});setUploading(false);return;}
    const{data:urlData}=sb.storage.from("listing-images").getPublicUrl(fp);
    const newImgs=[...images,urlData.publicUrl];
    setImages(newImgs);
    if(biz.listing_id) await sb.from("listings").update({images:newImgs}).eq("id",biz.listing_id);
    else await sb.from("business_accounts").update({images:newImgs}).eq("id",biz.id);
    setToast({msg:"Photo uploaded",type:"success"});setUploading(false);
  };

  const del=async(url)=>{
    const newImgs=images.filter(i=>i!==url);
    setImages(newImgs);
    if(biz.listing_id) await sb.from("listings").update({images:newImgs}).eq("id",biz.listing_id);
    else await sb.from("business_accounts").update({images:newImgs}).eq("id",biz.id);
    const fp=url.split("/listing-images/")[1];
    if(fp) sb.storage.from("listing-images").remove([fp]);
    setToast({msg:"Photo removed",type:"success"});
  };

  return(
    <div>
      {toast&&<Toast msg={toast.msg} type={toast.type} onDone={()=>setToast(null)}/>}
      {biz.status==="pending"&&<div className="alert alert-warn" style={{marginBottom:16}}>⏳ Under review. Fill in your details and upload photos now — they go live on approval.</div>}
      {biz.status==="active"&&<div className="alert alert-success" style={{marginBottom:16}}>✓ Your listing is live on xairod.com</div>}

      <div className="card">
        <div className="card-title">📸 Business Photos</div>
        <div style={{fontSize:11,color:"rgba(255,255,255,0.3)",marginBottom:14}}>Up to 6 photos · JPG/PNG/WebP · Max 5MB each · First photo = cover image</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:12}}>
          {images.map((url,i)=>(
            <div key={url} style={{position:"relative",aspectRatio:"4/3",borderRadius:10,overflow:"hidden",border:"1px solid rgba(255,255,255,0.1)"}}>
              <img src={url} alt={`Photo ${i+1}`} style={{width:"100%",height:"100%",objectFit:"cover"}}/>
              {i===0&&<div style={{position:"absolute",top:6,left:6,background:"#4DD994",color:"#03311A",fontSize:8,fontWeight:800,padding:"2px 7px",borderRadius:4}}>COVER</div>}
              <button onClick={()=>del(url)} style={{position:"absolute",top:6,right:6,width:24,height:24,borderRadius:"50%",background:"rgba(0,0,0,0.6)",border:"none",color:"white",cursor:"pointer",fontSize:14,display:"flex",alignItems:"center",justifyContent:"center"}}>×</button>
            </div>
          ))}
          {images.length<6&&(
            <label style={{aspectRatio:"4/3",borderRadius:10,border:"1.5px dashed rgba(255,255,255,0.15)",background:"rgba(255,255,255,0.02)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",cursor:"pointer",gap:6}}>
              <input type="file" accept="image/jpeg,image/png,image/webp" style={{display:"none"}} onChange={e=>e.target.files[0]&&upload(e.target.files[0])} disabled={uploading}/>
              <div style={{fontSize:24}}>{uploading?"⏳":"📷"}</div>
              <div style={{fontSize:10,color:"rgba(255,255,255,0.35)",fontWeight:600}}>{uploading?"Uploading…":"Add Photo"}</div>
            </label>
          )}
        </div>
      </div>

      <div className="card">
        <div className="card-title">Business Details</div>
        <div className="form-group"><label className="label">Business Name</label><input className="input" value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="Your business name"/></div>
        <div className="form-group"><label className="label">City / Location</label><input className="input" value={form.city} onChange={e=>setForm({...form,city:e.target.value})} placeholder="Cairo, Egypt"/></div>
        <div className="form-group"><label className="label">Description</label><textarea className="input" rows={4} value={form.description} onChange={e=>setForm({...form,description:e.target.value})}/></div>
        <button className="btn-primary" onClick={save}>{saved?"✓ Saved":"Save Changes"}</button>
      </div>
    </div>
  );
}

function MessagesScreen({biz}){
  const[rooms,setRooms]=useState([]);
  const[loading,setLoading]=useState(true);
  const[active,setActive]=useState(null);
  const[msgs,setMsgs]=useState([]);
  const[input,setInput]=useState("");
  const[sending,setSending]=useState(false);
  const bottom=useRef(null);

  useEffect(()=>{
    if(!biz?.id) return;
    sb.from("service_requests").select("*").eq("assigned_business_id",biz.id).eq("status","in_progress").order("created_at",{ascending:false})
      .then(({data})=>{if(data)setRooms(data.map(r=>({id:r.id,listing_name:r.listing_name||"Chat",customer_id:r.user_id,ref:r.ref})));setLoading(false);});
  },[biz?.id]);

  const open=async(room)=>{
    setActive(room);
    const{data}=await sb.from("direct_messages").select("*").eq("room_id",room.id).order("created_at",{ascending:true});
    setMsgs(data||[]);
    await sb.from("direct_messages").update({read_by_business:true}).eq("room_id",room.id).neq("sender_role","business");
    setTimeout(()=>bottom.current?.scrollIntoView({behavior:"smooth"}),100);
  };

  const send=async()=>{
    if(!input.trim()||sending||!active) return;
    setSending(true);
    const{data}=await sb.from("direct_messages").insert({room_id:active.id,sender_id:biz.user_id,sender_role:"business",content:input.trim(),type:"text",read_by_customer:false,read_by_business:true,business_user_id:biz.user_id,customer_id:active.customer_id}).select().single();
    if(data) setMsgs(p=>[...p,data]);
    sb.from("notifications").insert({user_id:active.customer_id,icon:"💬",message:biz.name+" sent you a message. Tap to read.",type:"direct_message",metadata:{room_id:active.id}});
    setInput("");setSending(false);
    setTimeout(()=>bottom.current?.scrollIntoView({behavior:"smooth"}),100);
  };

  if(active) return(
    <div style={{display:"flex",flexDirection:"column",height:"calc(100vh - 120px)"}}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
        <button className="btn-outline" onClick={()=>{setActive(null);setMsgs([]);}}>← Back</button>
        <div style={{fontFamily:"'Fraunces',serif",fontSize:15,fontWeight:800}}>{active.listing_name}</div>
        <span style={{fontSize:10,color:"rgba(255,255,255,0.3)"}}>Ref: {active.ref||active.id?.slice(0,8)}</span>
      </div>
      <div style={{flex:1,overflowY:"auto",padding:"0 0 10px"}}>
        {msgs.length===0&&<p style={{color:"rgba(255,255,255,0.3)",fontSize:12,textAlign:"center",padding:40}}>No messages yet. Start the conversation.</p>}
        {msgs.map((m,i)=>{
          const isMe=m.sender_role==="business";
          return(
            <div key={m.id||i} style={{display:"flex",justifyContent:isMe?"flex-end":"flex-start",marginBottom:10}}>
              <div style={{maxWidth:"75%",background:isMe?"#0A6B3E":m.type==="system"?"rgba(200,134,26,0.1)":"rgba(255,255,255,0.07)",padding:"9px 13px",borderRadius:isMe?"12px 12px 4px 12px":"12px 12px 12px 4px",fontSize:12,lineHeight:1.55,color:m.type==="system"?"#F5C550":"#FEFCF7",border:m.type==="system"?"1px solid rgba(200,134,26,0.2)":"none",fontStyle:m.type==="system"?"italic":"normal",whiteSpace:"pre-wrap"}}>
                {m.content}
              </div>
            </div>
          );
        })}
        <div ref={bottom}/>
      </div>
      <div style={{display:"flex",gap:10,paddingTop:10,borderTop:"1px solid rgba(255,255,255,0.06)"}}>
        <textarea value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}}} placeholder="Type a message…" rows={2} className="input" style={{flex:1,resize:"none"}}/>
        <button className="btn-primary" onClick={send} disabled={!input.trim()||sending} style={{alignSelf:"flex-end"}}>{sending?"…":"Send →"}</button>
      </div>
    </div>
  );

  return loading?<div style={{padding:40,textAlign:"center",color:"rgba(255,255,255,0.3)"}}>Loading…</div>:
  rooms.length===0?<div className="empty"><div className="empty-icon">💬</div><div className="empty-title">No chats yet</div><div className="empty-sub">Chats open when a customer accepts your quote and pays</div></div>:(
    <div>
      {rooms.map(r=>(
        <div key={r.id} className="card" style={{display:"flex",alignItems:"center",gap:12,cursor:"pointer"}} onClick={()=>open(r)}>
          <div style={{width:40,height:40,borderRadius:"50%",background:"rgba(77,217,148,0.1)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0}}>👤</div>
          <div style={{flex:1}}>
            <div style={{fontSize:13,fontWeight:700,color:"#FEFCF7"}}>{r.listing_name}</div>
            <div style={{fontSize:10,color:"rgba(255,255,255,0.3)"}}>Ref: {r.ref||r.id?.slice(0,8)}</div>
          </div>
          <span style={{color:"rgba(255,255,255,0.3)",fontSize:18}}>›</span>
        </div>
      ))}
    </div>
  );
}

function SettingsScreen({biz}){
  const[phone,setPhone]=useState(biz?.phone||"");
  const[saved,setSaved]=useState(false);
  const save=async()=>{
    await sb.from("business_accounts").update({phone}).eq("id",biz.id);
    setSaved(true);setTimeout(()=>setSaved(false),2500);
  };
  return(
    <div>
      <div className="card">
        <div className="card-title">📞 Contact Number (Private)</div>
        <p style={{fontSize:11,color:"rgba(255,255,255,0.3)",marginBottom:14}}>Your WhatsApp/phone number. <strong style={{color:"#F5C550"}}>Never shown publicly.</strong> Only visible to Xairod admins.</p>
        <div style={{display:"flex",gap:10}}>
          <input className="input" value={phone} onChange={e=>setPhone(e.target.value)} placeholder="+234 800 000 0000" style={{flex:1}}/>
          <button className="btn-primary" onClick={save}>{saved?"✓ Saved":"Save"}</button>
        </div>
      </div>
      <div className="card">
        <div className="card-title">Account Info</div>
        {[["Business","name"],["Category",null],["Status","status"],["Email","email"]].map(([label,key])=>(
          <div key={label} style={{display:"flex",justifyContent:"space-between",padding:"10px 0",borderBottom:"1px solid rgba(255,255,255,0.05)"}}>
            <span style={{fontSize:11,color:"rgba(255,255,255,0.35)"}}>{label}</span>
            <span style={{fontSize:11,fontWeight:700,color:biz?.status==="active"&&label==="Status"?"#4DD994":biz?.status==="pending"&&label==="Status"?"#F5C550":"#FEFCF7"}}>
              {key==="status"?(biz.status==="active"?"✓ Active":"⏳ Pending"):key?biz[key]||"—":CATS[biz.category]||biz.category||"—"}
            </span>
          </div>
        ))}
        <div style={{marginTop:16,fontSize:11,color:"rgba(255,255,255,0.3)"}}>
          Need help? <a href="mailto:hello@xairod.com" style={{color:"#4DD994"}}>hello@xairod.com</a> · <a href="https://t.me/ckairod" style={{color:"#4DD994"}}>t.me/ckairod</a>
        </div>
      </div>
    </div>
  );
}

// ── MAIN APP ──────────────────────────────────────────────────────────────────
function App(){
  const[authUser,setAuthUser]=useState(null);
  const[biz,setBiz]=useState(null);
  const[page,setPage]=useState("dashboard");
  const[requests,setRequests]=useState([]);
  const[bookings,setBookings]=useState([]);
  const[loading,setLoading]=useState(true);
  const[sideOpen,setSideOpen]=useState(false);
  const[newLeads,setNewLeads]=useState(0);

  const loadData=async(bizId)=>{
    const{data:reqs}=await sb.from("service_requests").select("*").eq("assigned_business_id",bizId).in("status",["open","quoted","new"]).order("created_at",{ascending:false});
    setRequests(reqs||[]);
    setNewLeads((reqs||[]).filter(r=>r.status==="open").length);
    const{data:bks}=await sb.from("bookings").select("*").eq("business_id",bizId).order("created_at",{ascending:false});
    setBookings(bks||[]);
  };

  useEffect(()=>{
    sb.auth.getSession().then(async({data:{session}})=>{
      if(session?.user){
        const{data:rows}=await sb.from("business_accounts").select("*").eq("user_id",session.user.id).limit(1);
        if(rows?.[0]){setAuthUser(session.user);setBiz(rows[0]);await loadData(rows[0].id);}
      }
      setLoading(false);
    });
    const{data:{subscription}}=sb.auth.onAuthStateChange((event,session)=>{
      if(event==="SIGNED_OUT"){setAuthUser(null);setBiz(null);}
    });
    return()=>subscription.unsubscribe();
  },[]);

  if(loading) return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#0D0A05"}}><div style={{fontFamily:"'Fraunces',serif",fontSize:24,fontWeight:900,color:"#4DD994"}}>Loading…</div></div>;
  if(!authUser||!biz) return <AuthScreen onAuth={async(bizData)=>{setAuthUser((await sb.auth.getUser()).data.user);setBiz(bizData);await loadData(bizData.id);}}/>;

  const NAV=[
    {id:"dashboard",icon:"⊞",label:"Dashboard"},
    {id:"messages",icon:"💬",label:"Messages"},
    {id:"requests",icon:"📥",label:"Requests",badge:newLeads},
    {id:"bookings",icon:"✅",label:"Bookings"},
    {id:"services",icon:"🛎️",label:"Services"},
    {id:"availability",icon:"📅",label:"Availability"},
    {id:"customers",icon:"👥",label:"Customers"},
    {id:"payouts",icon:"💰",label:"Payouts"},
    {id:"listing",icon:"🏢",label:"My Listing"},
    {id:"settings",icon:"⚙️",label:"Settings"},
  ];

  const PAGE_TITLES={dashboard:"Dashboard",messages:"Messages",requests:"Requests",bookings:"Bookings",services:"Services",availability:"Availability",customers:"Customers",payouts:"Payouts",listing:"My Listing",settings:"Settings"};

  const SCREENS={
    dashboard:<DashboardScreen biz={biz} requests={requests} bookings={bookings} setPage={setPage}/>,
    messages:<MessagesScreen biz={biz}/>,
    requests:<RequestsScreen biz={biz} requests={requests} onUpdate={()=>loadData(biz.id)}/>,
    bookings:<BookingsScreen biz={biz} bookings={bookings} onUpdate={()=>loadData(biz.id)}/>,
    services:<ServicesScreen biz={biz}/>,
    availability:<AvailabilityScreen biz={biz}/>,
    customers:<CustomersScreen biz={biz}/>,
    payouts:<PayoutsScreen biz={biz} bookings={bookings}/>,
    listing:<ListingScreen biz={biz} onUpdate={()=>loadData(biz.id)}/>,
    settings:<SettingsScreen biz={biz}/>,
  };

  const Sidebar=()=>(
    <div className={"sidebar"+(sideOpen?" open":"")}>
      <div className="sidebar-logo">
        <div className="logo-text"><span className="x">X</span>airod<span className="d">.</span></div>
        <div style={{fontSize:10,color:"rgba(255,255,255,0.3)",marginTop:2}}>Business Portal</div>
      </div>
      <nav className="nav">
        {NAV.map(item=>(
          <button key={item.id} className={"nav-item"+(page===item.id?" active":"")} onClick={()=>{setPage(item.id);setSideOpen(false);}}>
            <span className="nav-icon">{item.icon}</span>
            <span>{item.label}</span>
            {item.badge>0&&<span className="badge">{item.badge}</span>}
          </button>
        ))}
      </nav>
      <div style={{padding:"16px 18px",borderTop:"1px solid rgba(255,255,255,0.06)"}}>
        <div style={{fontSize:11,fontWeight:700,color:"#FEFCF7",marginBottom:2}}>{biz.name}</div>
        <div style={{fontSize:10,color:"rgba(255,255,255,0.3)",marginBottom:12}}>{biz.email}</div>
        <button className="btn-outline" style={{width:"100%",fontSize:11}} onClick={async()=>{await sb.auth.signOut();setAuthUser(null);setBiz(null);}}>Sign Out</button>
      </div>
    </div>
  );

  return(
    <div className="layout">
      <div className={"overlay-bg"+(sideOpen?" open":"")} onClick={()=>setSideOpen(false)}/>
      <div className="mob-bar">
        <button onClick={()=>setSideOpen(true)} style={{background:"none",border:"none",color:"#FEFCF7",fontSize:22,cursor:"pointer"}}>☰</button>
        <div className="logo-text" style={{fontSize:18}}><span className="x">X</span>airod<span className="d">.</span></div>
        <div style={{width:30}}/>
      </div>
      <Sidebar/>
      <div className="main">
        <div className="topbar">
          <div className="page-title">{PAGE_TITLES[page]||page}</div>
          <div style={{fontSize:11,color:"rgba(255,255,255,0.3)"}}>{biz.name} · <span style={{color:biz.status==="active"?"#4DD994":"#F5C550"}}>{biz.status==="active"?"● Live":"● Pending"}</span></div>
        </div>
        <div className="content">{SCREENS[page]||SCREENS.dashboard}</div>
      </div>
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
