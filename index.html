<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Xairod · Business Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,800;0,9..144,900&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Outfit',sans-serif;background:#0D0A05;color:#FEFCF7;min-height:100vh;}
input,textarea,select{font-family:'Outfit',sans-serif;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px;}
.sidebar{width:220px;background:#141008;border-right:1px solid rgba(255,255,255,0.06);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;overflow-y:auto;transition:transform 0.25s ease;}
    .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:99;}
    @media(max-width:768px){
      .sidebar{transform:translateX(-100%);}
      .sidebar.open{transform:translateX(0);}
      .sidebar-overlay.open{display:block;}
      .main{margin-left:0!important;}
      .mobile-header{display:flex!important;}
      .stat-grid{grid-template-columns:1fr 1fr!important;}
      .content{padding:14px!important;}
      table{font-size:11px;}
      .hide-mobile{display:none!important;}
    }
    .mobile-header{display:none;background:#141008;padding:12px 16px;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,0.06);position:fixed;top:0;left:0;right:0;z-index:98;}
.main-wrap{margin-left:220px;min-height:100vh;}
.topbar{background:#141008;border-bottom:1px solid rgba(255,255,255,0.06);padding:0 28px;height:58px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
.content{padding:24px 28px 48px;}
.card{background:#141008;border-radius:14px;border:1px solid rgba(255,255,255,0.07);padding:20px;}
.input{width:100%;padding:11px 14px;border-radius:10px;border:1.5px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:#FEFCF7;font-size:13px;outline:none;transition:border-color 0.15s;}
.input:focus{border-color:#4DD994;}
.input::placeholder{color:rgba(255,255,255,0.2);}
select.input option{background:#1a1510;color:#FEFCF7;}
.label{font-size:11px;font-weight:700;color:rgba(255,255,255,0.4);margin-bottom:6px;display:block;text-transform:uppercase;letter-spacing:0.8px;}
.btn-primary{background:#4DD994;color:#03311A;border:none;padding:12px 20px;border-radius:10px;font-weight:800;font-size:13px;cursor:pointer;}
.btn-primary:disabled{opacity:0.4;cursor:default;}
.btn-outline{background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.7);border:1px solid rgba(255,255,255,0.1);padding:10px 18px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;}
.btn-red{background:rgba(192,57,43,0.15);color:#E74C3C;border:1px solid rgba(192,57,43,0.25);padding:8px 14px;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;margin-bottom:2px;font-size:12px;font-weight:600;color:rgba(255,255,255,0.4);transition:all 0.15s;}
.nav-item:hover{background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.8);}
.nav-item.active{background:rgba(77,217,148,0.12);color:#4DD994;font-weight:700;}
.badge-pill{padding:3px 9px;border-radius:20px;font-size:9px;font-weight:800;text-transform:uppercase;}
.badge-new{background:rgba(93,173,226,0.2);color:#5DADE2;}
.badge-quoted{background:rgba(245,197,80,0.2);color:#F5C550;}
.badge-progress{background:rgba(200,134,26,0.2);color:#F5C550;}
.badge-completed{background:rgba(77,217,148,0.2);color:#4DD994;}
.stat-card{background:#141008;border-radius:12px;border:1px solid rgba(255,255,255,0.07);padding:18px;position:relative;overflow:hidden;}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
.stat-green::before{background:linear-gradient(90deg,#0A6B3E,#4DD994);}
.stat-gold::before{background:linear-gradient(90deg,#C8861A,#F5C550);}
.stat-blue::before{background:linear-gradient(90deg,#2471A3,#5DADE2);}
.stat-purple::before{background:linear-gradient(90deg,#8E44AD,#BB8FCE);}
.table-wrap{background:#141008;border-radius:14px;border:1px solid rgba(255,255,255,0.07);overflow:hidden;}
table{width:100%;border-collapse:collapse;}
th{padding:10px 16px;text-align:left;font-size:9px;font-weight:700;color:rgba(255,255,255,0.25);text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid rgba(255,255,255,0.05);}
td{padding:13px 16px;font-size:12px;color:rgba(255,255,255,0.55);border-bottom:1px solid rgba(255,255,255,0.04);}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(255,255,255,0.02);}
.td-main{font-weight:700;color:#FEFCF7;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:#1a1510;border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:24px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;}
.form-group{margin-bottom:14px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.alert{padding:10px 14px;border-radius:8px;font-size:12px;font-weight:600;margin-bottom:12px;}
.alert-error{background:rgba(192,57,43,0.12);border:1px solid rgba(192,57,43,0.25);color:#E74C3C;}
.alert-success{background:rgba(77,217,148,0.1);border:1px solid rgba(77,217,148,0.2);color:#4DD994;}
.alert-warn{background:rgba(200,134,26,0.1);border:1px solid rgba(200,134,26,0.2);color:#F5C550;}
.request-card{background:#141008;border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:16px;margin-bottom:10px;}
.ref-tag{font-family:monospace;font-size:10px;font-weight:700;color:#4DD994;background:rgba(77,217,148,0.1);padding:3px 8px;border-radius:4px;display:inline-block;}
.empty-state{text-align:center;padding:48px 20px;color:rgba(255,255,255,0.3);}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

// ── CONFIG ────────────────────────────────────────────────────────────────────
const SUPA_URL = "https://gfvsosvszxwazuqnsavq.supabase.co";
const SUPA_KEY = "sb_publishable_VmI5TxyIucgncKe9GblOCg_YkqpXPv0";
const { createClient } = supabase;
const sb = createClient(SUPA_URL, SUPA_KEY);

const COMMISSION_RATES = {
  agency:12, housing:10, health:15, travel:12,
  food:10, transport:17, beauty:12, default:12
};

const CATEGORIES = [
  "Agency / Admission","Housing","Health","Travel",
  "Food & Catering","Transport","Beauty","Finance","Jobs","Other"
];

const CAT_MAP = {
  "Agency / Admission":"agency","Housing":"housing","Health":"health",
  "Travel":"travel","Food & Catering":"food","Transport":"transport",
  "Beauty":"beauty","Finance":"finance","Jobs":"jobs","Other":"other"
};

const KYC_REQUIREMENTS = {
  health:  [{id:"medical_license",label:"Medical License / Registration Certificate",required:true,hint:"Egyptian Medical Syndicate registration or equivalent"},{id:"government_id",label:"Government-Issued Photo ID",required:true,hint:"National ID or passport of the owner"},{id:"facility_cert",label:"Facility Registration Certificate",required:true,hint:"Health ministry registration or clinic operating licence"},{id:"professional_cert",label:"Professional Qualifications",required:false,hint:"Medical degree or specialist certificate (optional)"}],
  food:    [{id:"passport",label:"International Passport",required:true,hint:"Valid international passport of the business owner"},{id:"health_cert",label:"Health & Safety Certificate",required:true,hint:"Egyptian food authority food safety certificate"},{id:"business_reg",label:"Business Registration",required:true,hint:"Commercial registry or trade licence"}],
  travel:  [{id:"tourism_license",label:"Tourism Operator License",required:true,hint:"Egyptian Tourism Authority operator licence"},{id:"passport",label:"International Passport",required:true,hint:"Valid passport of owner"},{id:"business_reg",label:"Business Registration",required:false,hint:"Commercial registry if registered"}],
  housing: [{id:"property_doc",label:"Property Ownership / Rental Authority",required:true,hint:"Title deed or written authority to rent"},{id:"government_id",label:"Government-Issued Photo ID",required:true,hint:"National ID or passport of property owner"}],
  school:  [{id:"edu_license",label:"Educational / Agency License",required:true,hint:"Ministry of Education licence or CAC registration"},{id:"passport",label:"International Passport",required:true,hint:"Valid passport of director"},{id:"business_reg",label:"Business Registration",required:false,hint:"Commercial registry"}],
  agency:  [{id:"edu_license",label:"Agency Registration Certificate",required:true,hint:"CAC or equivalent registration"},{id:"passport",label:"International Passport",required:true,hint:"Valid passport of owner"}],
  language:[{id:"edu_license",label:"Language School License",required:true,hint:"Ministry of Education approval"},{id:"passport",label:"International Passport",required:true,hint:"Valid passport of director"}],
  other:   [{id:"passport",label:"International Passport",required:true,hint:"Valid passport of the business owner"},{id:"business_reg",label:"Business Registration",required:false,hint:"Commercial registry or trade licence"}],
};

// ── KYC UPLOAD + DUE DILIGENCE STEP ──────────────────────────────────────────
function KYCUploadStep({bizCat,onBack,onComplete,loading,err,setErr}){
  const catKey = CAT_MAP[bizCat]||"other";
  const requirements = KYC_REQUIREMENTS[catKey]||KYC_REQUIREMENTS["other"];
  const[uploads,setUploads]=useState({});
  const[uploading,setUploading]=useState({});
  const[ddChecked,setDdChecked]=useState({});

  const DD_ITEMS=[
    {id:"dd1",text:"All information provided is accurate and truthful. I understand that false information leads to immediate termination and potential legal action."},
    {id:"dd2",text:"This business complies with all applicable laws and is not involved in any illegal activity, money laundering, or financial fraud."},
    {id:"dd3",text:"I am the authorised representative of this business with full legal authority to enter into this agreement on its behalf."},
    {id:"dd4",text:"I consent to Xairod conducting additional verification checks and accept that Xairod may decline my application at its sole discretion."},
    {id:"dd5",text:"I consent to secure storage of submitted documents for verification purposes and agree to the Privacy Policy at xairod.com/privacy."},
  ];

  const uploadFile=(docType,file)=>{
    if(!file) return;
    if(file.size>10*1024*1024){setErr("File too large. Maximum 10MB.");return;}
    setUploading(p=>({...p,[docType]:true}));
    setUploads(p=>({...p,[docType]:{file,name:file.name,size:file.size}}));
    setUploading(p=>({...p,[docType]:false}));
  };

  const allDocsReady=requirements.filter(r=>r.required).every(r=>uploads[r.id]);
  const allDDChecked=DD_ITEMS.every(d=>ddChecked[d.id]);

  const handleSubmit=()=>{
    const missing=requirements.filter(r=>r.required&&!uploads[r.id]).map(r=>r.label);
    if(missing.length>0){setErr("Please upload: "+missing.join(", "));return;}
    if(!allDDChecked){setErr("Please confirm all 5 due diligence declarations.");return;}
    setErr("");onComplete(uploads);
  };

  return(
    <div>
      <div style={{fontSize:11,fontWeight:700,color:"rgba(255,255,255,0.4)",marginBottom:10,textTransform:"uppercase",letterSpacing:0.8}}>Step 3 — Verification &amp; Due Diligence</div>
      <div style={{background:"rgba(200,134,26,0.1)",border:"1px solid rgba(200,134,26,0.2)",borderRadius:8,padding:"10px 12px",marginBottom:14,fontSize:11,color:"#F5C550",lineHeight:1.6}}>
        🔒 Documents are encrypted and stored privately. Only Xairod administrators can access them.
      </div>

      <div style={{fontSize:11,fontWeight:700,color:"rgba(255,255,255,0.5)",marginBottom:8}}>Required Documents</div>
      {requirements.map(req=>(
        <div key={req.id} style={{marginBottom:12}}>
          <label style={{fontSize:11,fontWeight:700,color:"rgba(255,255,255,0.4)",marginBottom:4,display:"block",textTransform:"uppercase",letterSpacing:0.7}}>
            {req.label} {req.required&&<span style={{color:"#C0392B"}}>*</span>}
            {!req.required&&<span style={{color:"rgba(255,255,255,0.2)",fontWeight:400,textTransform:"none"}}> (optional)</span>}
          </label>
          <div style={{fontSize:9,color:"rgba(255,255,255,0.25)",marginBottom:5}}>{req.hint}</div>
          {uploads[req.id]?(
            <div style={{background:"rgba(77,217,148,0.08)",border:"1px solid rgba(77,217,148,0.2)",borderRadius:8,padding:"9px 12px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
              <div>
                <div style={{fontSize:11,fontWeight:700,color:"#4DD994"}}>✓ {uploads[req.id].name}</div>
                <div style={{fontSize:9,color:"rgba(255,255,255,0.3)"}}>{(uploads[req.id].size/1024).toFixed(1)} KB</div>
              </div>
              <button onClick={()=>setUploads(p=>{const n={...p};delete n[req.id];return n;})}
                style={{background:"none",border:"none",color:"rgba(255,255,255,0.3)",cursor:"pointer",fontSize:18}}>×</button>
            </div>
          ):(
            <label style={{display:"block",padding:"11px",borderRadius:8,border:"1.5px dashed rgba(255,255,255,0.12)",background:"rgba(255,255,255,0.02)",cursor:"pointer",textAlign:"center"}}>
              <input type="file" accept=".jpg,.jpeg,.png,.pdf" style={{display:"none"}}
                onChange={e=>e.target.files[0]&&uploadFile(req.id,e.target.files[0])}/>
              <div style={{fontSize:18,marginBottom:3}}>{uploading[req.id]?"⏳":"📎"}</div>
              <div style={{fontSize:10,color:"rgba(255,255,255,0.35)",fontWeight:600}}>
                {uploading[req.id]?"Processing…":"Click to upload (JPG, PNG or PDF · max 10MB)"}
              </div>
            </label>
          )}
        </div>
      ))}

      <div style={{height:1,background:"rgba(255,255,255,0.06)",margin:"14px 0"}}/>
      <div style={{fontSize:11,fontWeight:700,color:"rgba(255,255,255,0.5)",marginBottom:8}}>Due Diligence Declarations</div>
      {DD_ITEMS.map((item,i)=>(
        <div key={item.id} onClick={()=>setDdChecked(p=>({...p,[item.id]:!p[item.id]}))}
          style={{display:"flex",gap:10,alignItems:"flex-start",marginBottom:7,padding:"10px 12px",background:ddChecked[item.id]?"rgba(77,217,148,0.06)":"rgba(255,255,255,0.02)",borderRadius:8,border:"1px solid",borderColor:ddChecked[item.id]?"rgba(77,217,148,0.2)":"rgba(255,255,255,0.05)",cursor:"pointer"}}>
          <div style={{width:18,height:18,borderRadius:4,border:"2px solid",borderColor:ddChecked[item.id]?"#4DD994":"rgba(255,255,255,0.2)",background:ddChecked[item.id]?"#4DD994":"transparent",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,color:"#03311A",flexShrink:0,marginTop:1,fontWeight:800}}>
            {ddChecked[item.id]?"✓":""}
          </div>
          <div style={{fontSize:10,color:"rgba(255,255,255,0.5)",lineHeight:1.65}}>{i+1}. {item.text}</div>
        </div>
      ))}

      <div style={{background:"rgba(255,255,255,0.04)",borderRadius:8,padding:"9px 12px",margin:"12px 0",fontSize:9,color:"rgba(255,255,255,0.25)",lineHeight:1.7}}>
        <strong style={{color:"rgba(255,255,255,0.4)"}}>Privacy:</strong> Documents are retained for the duration of your Xairod partnership and deleted upon account closure. Request deletion at hello@xairod.com.
      </div>

      {err&&<div className="alert alert-error">{err}</div>}
      <div style={{display:"flex",gap:10}}>
        <button className="btn-outline" onClick={onBack} style={{flex:1}}>← Back</button>
        <button className="btn-primary" onClick={handleSubmit} disabled={loading||!allDocsReady||!allDDChecked}
          style={{flex:2,opacity:(allDocsReady&&allDDChecked)?1:0.45}}>
          {loading?"Submitting…":"Submit for Review →"}
        </button>
      </div>
    </div>
  );
}

// ── AUTH SCREEN ───────────────────────────────────────────────────────────────
function AuthScreen({onAuth}){
  const[view,setView]=useState("login");
  const[loading,setLoading]=useState(false);
  const[err,setErr]=useState("");
  const[success,setSuccess]=useState("");
  const[step,setStep]=useState(1);
  // Login
  const[email,setEmail]=useState("");
  const[password,setPassword]=useState("");
  // Register
  const[bizName,setBizName]=useState("");
  const[bizCat,setBizCat]=useState("");
  const[bizCity,setBizCity]=useState("Cairo, Egypt");
  const[bizPhone,setBizPhone]=useState("");
  const[bizDesc,setBizDesc]=useState("");
  const[ownerName,setOwnerName]=useState("");
  const[regEmail,setRegEmail]=useState("");
  const[regPwd,setRegPwd]=useState("");
  const[regPwd2,setRegPwd2]=useState("");
  const[agreed,setAgreed]=useState(false);

  const login=async()=>{
    if(!email||!password){setErr("Enter your email and password.");return;}
    setLoading(true);setErr("");
    const{data,error}=await sb.auth.signInWithPassword({email,password});
    if(error){setErr("Incorrect email or password.");setLoading(false);return;}
    const{data:biz}=await sb.from("business_accounts").select("*").eq("user_id",data.user.id).single();
    if(!biz){setErr("No business account found for this email.");setLoading(false);return;}
    onAuth(data.user,biz);setLoading(false);
  };

  const register=async(kycUploads={})=>{
    if(!bizName||!bizCat||!ownerName||!regEmail||!regPwd){setErr("Fill all required fields.");return;}
    if(regPwd!==regPwd2){setErr("Passwords do not match.");return;}
    if(regPwd.length<8){setErr("Password must be at least 8 characters.");return;}
    if(!agreed){setErr("Please accept the Partner Agreement.");return;}
    setLoading(true);setErr("");
    const{data,error}=await sb.auth.signUp({email:regEmail,password:regPwd});
    if(error){setErr(error.message);setLoading(false);return;}

    // data.user can be null if email confirmation is enabled — handle both cases
    const userId=data?.user?.id||data?.session?.user?.id;
    if(!userId){
      setSuccess("Almost there! Check your email and click the confirmation link. Once confirmed, come back and sign in.");
      setLoading(false);return;
    }

    const catKey=CAT_MAP[bizCat]||"other";
    // Create profile
    await sb.from("profiles").upsert({
      id:userId,name:ownerName,email:regEmail,role:"Business Owner"
    });
    // Create business account
    const{data:bizData,error:bizErr}=await sb.from("business_accounts").insert({
      user_id:userId,name:bizName,category:catKey,category_label:bizCat,
      city:bizCity,phone:bizPhone,description:bizDesc,owner_name:ownerName,
      email:regEmail,status:"pending",commission_rate:COMMISSION_RATES[catKey]||12
    }).select("id").single();
    if(bizErr){
      setErr("Account created but profile setup failed: "+bizErr.message+". Please contact hello@xairod.com");
      setLoading(false);return;
    }
    // Upload KYC documents to Supabase Storage
    if(kycUploads&&Object.keys(kycUploads).length>0&&bizData?.id){
      for(const[docType,doc] of Object.entries(kycUploads)){
        if(!doc?.file) continue;
        try{
          const ext=doc.file.name.split(".").pop();
          const filePath=userId+"/"+bizData.id+"/"+docType+"_"+Date.now()+"."+ext;
          const{error:upErr}=await sb.storage.from("kyc-documents").upload(filePath,doc.file,{upsert:true});
          if(!upErr){
            await sb.from("kyc_documents").insert({
              business_id:bizData.id,document_type:docType,
              file_path:filePath,file_name:doc.file.name,status:"pending"
            });
          }
        }catch(e){console.warn("KYC upload failed:",docType,e);}
      }
      await sb.from("business_accounts").update({
        kyc_status:"submitted",kyc_submitted_at:new Date().toISOString()
      }).eq("id",bizData.id);
    }
    setSuccess("Account created and documents submitted! Xairod will verify your identity within 24–48 hours.");

    // Send welcome email to business
    try{
      await fetch("https://xairod.supabase.co/functions/v1/send-email",{
        method:"POST",
        headers:{"Content-Type":"application/json","apikey":sb.supabaseKey||""},
        body:JSON.stringify({
          to:regEmail,
          template:"business_registered",
          data:{name:bizName,category:bizCat||catKey,ref:"XR-BIZ-"+(bizData?.id||"").slice(0,8).toUpperCase()}
        }),
      });
    }catch(e){console.warn("Welcome email failed:",e);}

    setLoading(false);
  };

  return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{width:"100%",maxWidth:420}}>
        <div style={{textAlign:"center",marginBottom:32}}>
          <div style={{fontFamily:"'Fraunces',serif",fontSize:32,fontWeight:900}}>
            <span style={{color:"#4DD994"}}>X</span>airod<span style={{color:"#C8861A"}}>.</span>
          </div>
          <div style={{fontSize:11,color:"rgba(255,255,255,0.3)",fontWeight:700,letterSpacing:2,textTransform:"uppercase",marginTop:4}}>Business Partner Portal</div>
        </div>
        <div style={{background:"#141008",border:"1px solid rgba(255,255,255,0.08)",borderRadius:16,padding:28}}>
          {view!=="forgot"&&(
            <div style={{display:"flex",gap:4,background:"rgba(255,255,255,0.04)",borderRadius:8,padding:4,marginBottom:24}}>
              {["login","register"].map(v=>(
                <button key={v} onClick={()=>{setView(v);setErr("");setSuccess("");setStep(1);}}
                  style={{flex:1,padding:8,borderRadius:6,border:"none",background:view===v?"#4DD994":"transparent",color:view===v?"#03311A":"rgba(255,255,255,0.4)",fontWeight:800,fontSize:12,cursor:"pointer"}}>
                  {v==="login"?"Sign In":"Register Business"}
                </button>
              ))}
            </div>
          )}
          {err&&<div className="alert alert-error">{err}</div>}
          {success&&<div className="alert alert-success">{success}</div>}

          {view==="login"&&!success&&(
            <>
              <div className="form-group"><label className="label">Email Address</label>
                <input className="input" type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="hello@yourbusiness.com"/></div>
              <div className="form-group"><label className="label">Password</label>
                <input className="input" type="password" value={password} onChange={e=>setPassword(e.target.value)}

function RequestsScreen({biz,requests,onUpdate,onGoToMessages}){
  const[quoteModal,setQuoteModal]=useState(null);
  const[price,setPrice]=useState("");
  const[timeline,setTimeline]=useState("");
  const[quoteNote,setQuoteNote]=useState("");
  const[loading,setLoading]=useState(false);
  const[err,setErr]=useState("");
  const[rooms,setRooms]=useState({}); // request_id → room
  const[unreadCounts,setUnreadCounts]=useState({}); // room_id → count

  // Load chat rooms for all requests — robust, no .single()
  React.useEffect(()=>{
    if(!biz?.user_id||!requests.length) return;
    const ids=requests.map(r=>r.id);
    sb.from("chat_rooms")
      .select("*")
      .in("request_id",ids)
      .then(({data,error})=>{
        if(error){console.warn("chat_rooms query error:",error.message);return;}
        const map={};
        (data||[]).forEach(r=>{map[r.request_id]=r;});
        setRooms(map);
        const roomIds=(data||[]).map(r=>r.id);
        if(roomIds.length>0){
          sb.from("direct_messages")
            .select("room_id")
            .in("room_id",roomIds)
            .eq("read_by_business",false)
            .neq("sender_role","business")
            .then(({data:msgs})=>{
              const counts={};
              (msgs||[]).forEach(m=>{counts[m.room_id]=(counts[m.room_id]||0)+1;});
              setUnreadCounts(counts);
            });
        }
      });
  },[requests.length,biz?.user_id]);

  const submitQuote=async()=>{
    if(!price||!timeline){setErr("Price and timeline required.");return;}
    setLoading(true);setErr("");
    const commission=biz?.commission_rate||12;
    const gross=parseFloat(price);
    const commAmt=Math.round(gross*commission/100);
    const payout=gross-commAmt;

    // 1. Insert quote
    await sb.from("quotes").insert({
      request_id:quoteModal.id,business_id:biz.id,
      price:gross,commission_rate:commission,commission_amount:commAmt,payout_amount:payout,
      timeline,notes:quoteNote,status:"pending"
    });

    // 2. Update request status
    await sb.from("service_requests").update({status:"quoted"}).eq("id",quoteModal.id);

    // 3. Notify customer — chat room opens only after they pay
    (async()=>{try{await sb.from("notifications").insert({
      user_id:quoteModal.user_id,icon:"💬",
      message:`${biz.name} sent you a quote of ${gross.toLocaleString()} NGN for request ${quoteModal.ref||""}. Go to My Requests to review and pay — your chat with the business opens once payment is confirmed.`,
      type:"quote",
      metadata:{request_id:quoteModal.id,request_ref:quoteModal.ref,amount:gross}
    });}catch{}})();

    onUpdate();setQuoteModal(null);setPrice("");setTimeline("");setQuoteNote("");setLoading(false);
  };

  return(
    <div className="content">
      <div style={{fontFamily:"'Fraunces',serif",fontSize:22,fontWeight:900,color:"#FEFCF7",marginBottom:4}}>Requests</div>
      <div style={{fontSize:11,color:"rgba(255,255,255,0.3)",marginBottom:20}}>{requests.length} total · {requests.filter(r=>r.status==="open").length} new</div>

      {requests.length===0?(
        <div className="empty-state">
          <div style={{fontSize:48,marginBottom:14}}>📭</div>
          <div style={{fontFamily:"'Fraunces',serif",fontSize:18,fontWeight:800,color:"rgba(255,255,255,0.5)",marginBottom:6}}>No requests yet</div>
          <div style={{fontSize:13}}>When users connect with {biz?.name||"your business"} on Xairod, requests appear here in real time.</div>
        </div>
      ):requests.map(req=>(
        <div key={req.id} className="request-card" style={{borderLeft:req.status==="open"?"3px solid #5DADE2":"1px solid rgba(255,255,255,0.07)"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
            <div>
              <span className="ref-tag">{req.ref}</span>
              <span style={{marginLeft:8,fontSize:10,color:"rgba(255,255,255,0.3)"}}>{new Date(req.created_at).toLocaleString()}</span>
            </div>
            <span className={`badge-pill badge-${req.status==="open"?"new":req.status}`}>{req.status==="open"?"New":req.status}</span>
          </div>
          <div style={{fontSize:13,fontWeight:600,color:"#FEFCF7",marginBottom:6,lineHeight:1.5}}>{req.what_i_need}</div>
          <div style={{display:"flex",gap:12,marginBottom:10,flexWrap:"wrap"}}>
            {req.when_needed&&<div style={{fontSize:10,color:"rgba(255,255,255,0.35)"}}>📅 {req.when_needed}</div>}
            {req.budget&&<div style={{fontSize:10,color:"rgba(255,255,255,0.35)"}}>💰 {req.budget}</div>}
          </div>
          {req.status==="open"&&(
            <div style={{display:"flex",gap:8}}>
              <button onClick={()=>{setQuoteModal(req);setErr("");}} className="btn-primary" style={{padding:"8px 18px",fontSize:12}}>Send Quote →</button>
              <button className="btn-red" onClick={async()=>{await sb.from("service_requests").update({status:"declined"}).eq("id",req.id);onUpdate();}}>Decline</button>
            </div>
          )}
          {req.status==="quoted"&&(
            <div style={{background:"rgba(245,197,80,0.06)",border:"1px solid rgba(245,197,80,0.15)",borderRadius:9,padding:"10px 12px"}}>
              <div style={{fontSize:11,color:"#F5C550",fontWeight:700,marginBottom:3}}>⏳ Quote sent — waiting for payment</div>
              <div style={{fontSize:10,color:"rgba(255,255,255,0.3)",lineHeight:1.5}}>The chat room and booking will appear here automatically once the customer accepts and pays. No action needed.</div>
            </div>
          )}
          {(req.status==="in_progress"||req.status==="accepted")&&(
            <div>
              <div style={{fontSize:11,color:"#4DD994",fontWeight:700,marginBottom:8}}>✅ Payment confirmed — deliver the service</div>
              {rooms[req.id]?(
                <button onClick={()=>onGoToMessages&&onGoToMessages(rooms[req.id])}
                  style={{display:"flex",alignItems:"center",gap:8,background:"rgba(77,217,148,0.08)",border:"1px solid rgba(77,217,148,0.2)",borderRadius:9,padding:"8px 12px",cursor:"pointer",fontFamily:"'Outfit',sans-serif",width:"100%"}}>
                  <span style={{fontSize:16}}>💬</span>
                  <div style={{flex:1,textAlign:"left"}}>
                    <div style={{fontSize:12,fontWeight:700,color:"#4DD994"}}>Chat with customer</div>
                    <div style={{fontSize:10,color:"rgba(255,255,255,0.35)"}}>Coordinate delivery here</div>
                  </div>

                    <span style={{background:"#C0392B",color:"white",fontSize:10,fontWeight:800,padding:"3px 9px",borderRadius:10}}>

                <div style={{fontSize:10,color:"rgba(255,255,255,0.3)"}}>Chat loading… check Messages tab</div>
              )}

      ))}

      {quoteModal&&(
        <div className="modal-overlay" onClick={()=>setQuoteModal(null)}>

            <div style={{fontFamily:"'Fraunces',serif",fontSize:18,fontWeight:800,color:"#FEFCF7",marginBottom:16}}>Send Quote</div>
            <div style={{background:"rgba(77,217,148,0.07)",borderRadius:10,padding:"10px 12px",marginBottom:16}}>
              <div style={{fontSize:10,color:"rgba(255,255,255,0.35)",marginBottom:3}}>{quoteModal.ref}</div>
              <div style={{fontSize:12,color:"#FEFCF7",lineHeight:1.5}}>{quoteModal.what_i_need}</div>
            </div>

            <div className="form-group"><label className="label">Your Price (EGP) *</label>
              <input className="input" type="number" value={price} onChange={e=>setPrice(e.target.value)} placeholder="e.g. 3000"/>
              {price&&<div style={{fontSize:10,color:"rgba(255,255,255,0.3)",marginTop:6,lineHeight:1.6}}>

      )}

  );
}

// ── LISTING ───────────────────────────────────────────────────────────────────
function ListingScreen({biz,onUpdate}){
  const[form,setForm]=useState({name:biz?.name||"",city:biz?.city||"",description:biz?.description||""});
  const[saving,setSaving]=useState(false);
  const[saved,setSaved]=useState(false);
  const[images,setImages]=useState([]);
  const[uploading,setUploading]=useState(false);
  const[uploadErr,setUploadErr]=useState("");
  const[toast,setToast]=useState(null);
  const showToast=(msg,type="success")=>{setToast({msg,type});setTimeout(()=>setToast(null),3000);};

  // Load existing images — from listing if linked, else from business_accounts
  useEffect(()=>{
    if(biz?.listing_id){
      sb.from("listings").select("images").eq("id",biz.listing_id).single()
        .then(({data})=>{if(data?.images&&Array.isArray(data.images))setImages(data.images);});
    } else if(biz?.id){
      // No listing yet — images stored on business account directly
      sb.from("business_accounts").select("images").eq("id",biz.id).single()
        .then(({data})=>{if(data?.images&&Array.isArray(data.images))setImages(data.images);});
    }
  },[biz?.listing_id,biz?.id]);

  const save=async()=>{
    setSaving(true);
    await sb.from("business_accounts").update({name:form.name,city:form.city,description:form.description}).eq("id",biz.id);
    if(biz.listing_id){
      await sb.from("listings").update({
        name:form.name,city:form.city,
        description:form.description
      }).eq("id",biz.listing_id);
    }
    setSaving(false);setSaved(true);setTimeout(()=>setSaved(false),3000);
    showToast("✓ Changes saved and live on Xairod");
    onUpdate();
  };

  const uploadImage=async(file)=>{
    if(!file) return;
    if(file.size>5*1024*1024){setUploadErr("Max 5MB per image.");return;}
    if(!["image/jpeg","image/png","image/webp"].includes(file.type)){
      setUploadErr("Only JPG, PNG or WebP allowed.");return;
    }
    if(images.length>=6){setUploadErr("Maximum 6 images per listing.");return;}
    setUploading(true);setUploadErr("");
    const ext=file.name.split(".").pop();
    const path=`${biz.id}/${Date.now()}.${ext}`;
    const{error:upErr}=await sb.storage.from("listing-images").upload(path,file,{upsert:false});
    if(upErr){setUploadErr("Upload failed: "+upErr.message);setUploading(false);return;}
    const{data:urlData}=sb.storage.from("listing-images").getPublicUrl(path);
    const newImages=[...images,urlData.publicUrl];
    setImages(newImages);
    // Save images — to listing if exists, otherwise to business_accounts
    if(biz.listing_id){
      await sb.from("listings").update({images:newImages}).eq("id",biz.listing_id);
    } else {
      await sb.from("business_accounts").update({images:newImages}).eq("id",biz.id);
    }
    showToast("Image uploaded — will go live when your account is approved");
    setUploading(false);
  };

  const deleteImage=async(url)=>{
    const newImages=images.filter(i=>i!==url);
    setImages(newImages);
    if(biz.listing_id){
      await sb.from("listings").update({images:newImages}).eq("id",biz.listing_id);
    }
    // Delete from storage
    const path=url.split("/listing-images/")[1];
    if(path) await sb.storage.from("listing-images").remove([path]);
    showToast("Image removed");
  };

  return(
    <div className="content">
      {toast&&<div className={`alert alert-${toast.type==="success"?"success":"error"}`} style={{marginBottom:16}}>{toast.msg}</div>}

    // Content filter — same rules as the user app
    function filterContent(text){
      const patterns=[
        {re:/(\+?\d[\d\s\-\(\)]{7,}\d)/g,          reason:"phone number"},
        {re:/[\w.\-]+@[\w.\-]+\.\w+/g,              reason:"email address"},
        {re:/whatsapp|telegram|signal/gi,            reason:"external messaging app"},
        {re:/zelle|venmo|cashapp|western.?union/gi,  reason:"external payment method"},
        {re:/pay.{0,10}(cash|outside|direct)/gi,     reason:"off-platform payment request"},
      ];
      for(const p of patterns){
        if(p.re.test(text)) return {blocked:true,reason:"Blocked: message contains "+p.reason+". All communication must stay on Xairod."};
      }
      return {blocked:false};
    }


    // ── BUSINESS MESSAGES SCREEN ──────────────────────────────────────────────
    function BusinessMessagesScreen({biz}){
      const[rooms,setRooms]=React.useState([]);
      const[loading,setLoading]=React.useState(true);
      const[activeRoom,setActiveRoom]=React.useState(null);
      const[messages,setMessages]=React.useState([]);
      const[input,setInput]=React.useState("");
      const[sending,setSending]=React.useState(false);
      const[filterWarn,setFilterWarn]=React.useState("");
      const[showPayCard,setShowPayCard]=React.useState(false);
      const[payAmount,setPayAmount]=React.useState("");
      const bottomRef=React.useRef(null);

      React.useEffect(()=>{
        if(!biz?.user_id) return;
        // Query by BOTH business_user_id AND business_id
        // Catches rooms where business_user_id wasn't set due to timing issues
        const loadRooms=async()=>{
          const{data,error}=await sb.from("chat_rooms")
            .select("*")
            .or(`business_user_id.eq.${biz.user_id},business_id.eq.${biz.id}`)
            .eq("status","active")
            .order("created_at",{ascending:false});
          if(error){console.warn("Rooms load error:",error.message);setLoading(false);return;}
          if(data&&data.length>0){
            // Auto-fix any rooms missing business_user_id
            for(const room of data){
              if(!room.business_user_id){
                await sb.from("chat_rooms").update({business_user_id:biz.user_id}).eq("id",room.id);
              }
            }
            setRooms(data);
          }
          setLoading(false);
        };
        loadRooms();
        // Listen for direct room open from Requests screen
        const handler=(e)=>openRoom(e.detail);
        window.addEventListener("openRoom",handler);
        return()=>window.removeEventListener("openRoom",handler);
      },[biz?.user_id]);

      const openRoom=async(room)=>{
        setActiveRoom(room);
        const{data}=await sb.from("direct_messages")
          .select("*").eq("room_id",room.id)
          .order("created_at",{ascending:true});
        setMessages(data||[]);
        // Mark as read
        await sb.from("direct_messages")
          .update({read_by_business:true})
          .eq("room_id",room.id).eq("sender_role","customer");
        // Subscribe realtime
        sb.channel("biz_room_"+room.id)
          .on("postgres_changes",{event:"INSERT",schema:"public",table:"direct_messages",filter:"room_id=eq."+room.id},
            payload=>{setMessages(prev=>[...prev,payload.new]);setTimeout(()=>bottomRef.current?.scrollIntoView({behavior:"smooth"}),100);})
          .subscribe();
        setTimeout(()=>bottomRef.current?.scrollIntoView({behavior:"smooth"}),200);
      };

      const send=async()=>{
        const text=input.trim();
        if(!text||sending||!activeRoom) return;
        const check=filterContent(text);
        if(check.blocked){setFilterWarn(check.reason);setTimeout(()=>setFilterWarn(""),5000);return;}
        setSending(true);setFilterWarn("");
        const{data:msg}=await sb.from("direct_messages").insert({
          room_id:activeRoom.id,
          sender_id:biz.user_id,
          sender_role:"business",
          content:text,type:"text",
          read_by_customer:false,read_by_business:true,
        }).select().single();
        if(msg) setMessages(prev=>[...prev,msg]);
        // Notify customer
        await sb.from("notifications").insert({
          user_id:activeRoom.customer_id,icon:"💬",
          message:biz.name+" sent you a message. Tap to read.",
          type:"direct_message",metadata:{room_id:activeRoom.id}
        });
        setInput("");setSending(false);
        setTimeout(()=>bottomRef.current?.scrollIntoView({behavior:"smooth"}),100);
      };

      const sendPayCard=async()=>{
        if(!payAmount||isNaN(payAmount)) return;
        const{data:msg}=await sb.from("direct_messages").insert({
          room_id:activeRoom.id,sender_id:biz.user_id,sender_role:"business",
          content:"Payment request: "+parseFloat(payAmount).toLocaleString()+" NGN",
          type:"payment_card",
          metadata:{amount:parseFloat(payAmount),currency:"NGN"},
          read_by_customer:false,read_by_business:true,
        }).select().single();
        if(msg) setMessages(prev=>[...prev,msg]);
        setShowPayCard(false);setPayAmount("");
        await sb.from("notifications").insert({
          user_id:activeRoom.customer_id,icon:"💳",
          message:biz.name+" sent you a payment request of "+parseFloat(payAmount).toLocaleString()+" NGN.",
          type:"payment_card",metadata:{room_id:activeRoom.id}
        });
        setTimeout(()=>bottomRef.current?.scrollIntoView({behavior:"smooth"}),100);
      };

      // ── Room list view ───────────────────────────────────────────────────
      if(!activeRoom) return(
        <div style={{padding:"24px 28px 48px"}}>
          <div style={{fontFamily:"'Fraunces',serif",fontSize:22,fontWeight:900,color:"#FEFCF7",marginBottom:4}}>Messages</div>
          <div style={{fontSize:11,color:"rgba(255,255,255,0.3)",marginBottom:20}}>Direct conversations with your customers — routed through Xairod</div>
          {loading?<div style={{color:"rgba(255,255,255,0.3)",padding:40,textAlign:"center"}}>Loading…</div>:
          rooms.length===0?(
            <div style={{textAlign:"center",padding:"48px 0"}}>
              <div style={{fontSize:48,marginBottom:12}}>💬</div>
              <div style={{fontFamily:"'Fraunces',serif",fontSize:18,fontWeight:800,color:"rgba(255,255,255,0.4)",marginBottom:6}}>No conversations yet</div>
              <div style={{fontSize:12,color:"rgba(255,255,255,0.25)"}}>When you send a quote to a customer, a chat room opens here automatically.</div>
            </div>
          ):rooms.map(room=>(
            <div key={room.id} onClick={()=>openRoom(room)}
              style={{background:"#141008",border:"1px solid rgba(255,255,255,0.07)",borderRadius:12,padding:"14px 16px",marginBottom:10,display:"flex",alignItems:"center",gap:12,cursor:"pointer"}}>
              <div style={{width:44,height:44,borderRadius:"50%",background:"rgba(77,217,148,0.1)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0}}>👤</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:13,fontWeight:700,color:"#FEFCF7",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{room.listing_name||"Customer Request"}</div>
                <div style={{fontSize:10,color:"rgba(255,255,255,0.35)",marginTop:2}}>Tap to open conversation</div>
              </div>
              <div style={{color:"rgba(255,255,255,0.3)",fontSize:18}}>›</div>
            </div>
          ))}
        </div>
      );

      // ── Active room chat view ────────────────────────────────────────────
      return(
        <div style={{display:"flex",flexDirection:"column",height:"calc(100vh - 58px)"}}>
          {/* Header */}
          <div style={{background:"#03311A",padding:"14px 20px",display:"flex",alignItems:"center",gap:12,flexShrink:0}}>
            <button onClick={()=>{setActiveRoom(null);setMessages([]);sb.removeAllChannels();}}
              style={{background:"none",border:"none",color:"white",fontSize:20,cursor:"pointer"}}>←</button>
            <div style={{width:36,height:36,borderRadius:"50%",background:"rgba(255,255,255,0.1)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>👤</div>
            <div style={{flex:1}}>
              <div style={{fontFamily:"'Fraunces',serif",fontSize:14,fontWeight:800,color:"white"}}>{activeRoom.listing_name||"Customer"}</div>
              <div style={{fontSize:10,color:"rgba(255,255,255,0.4)"}}>Protected by Xairod · Messages are monitored</div>
            </div>
          </div>

          {/* Messages */}
          <div style={{flex:1,overflowY:"auto",padding:"14px 20px"}}>
            <div style={{textAlign:"center",marginBottom:14,padding:"8px 12px",background:"rgba(77,217,148,0.05)",borderRadius:8,border:"1px solid rgba(77,217,148,0.1)"}}>
              <div style={{fontSize:10,color:"rgba(255,255,255,0.3)",lineHeight:1.5}}>🔒 All messages are monitored by Xairod. Do not share contact details or request off-platform payments.</div>
            </div>
            {messages.map((msg,i)=>{
              const isMe=msg.sender_role==="business";
              if(msg.type==="quote_card"){
                const m=msg.metadata||{};
                return(
                  <div key={msg.id||i} style={{marginBottom:14}}>
                    <div style={{background:"rgba(200,134,26,0.1)",border:"1.5px solid rgba(200,134,26,0.2)",borderRadius:12,padding:"12px 14px",maxWidth:"85%",margin:"0 auto"}}>
                      <div style={{fontSize:9,fontWeight:800,color:"#C8861A",textTransform:"uppercase",letterSpacing:0.5,marginBottom:6}}>💼 Quote Sent</div>
                      <div style={{fontFamily:"'Fraunces',serif",fontSize:20,fontWeight:900,color:"#FEFCF7"}}>{parseFloat(m.price||0).toLocaleString()} {m.currency||"NGN"}</div>
                      {m.notes&&<div style={{fontSize:11,color:"rgba(255,255,255,0.5)",marginTop:4}}>{m.notes}</div>}
                      <div style={{fontSize:9,color:"rgba(255,255,255,0.25)",marginTop:6}}>{new Date(msg.created_at).toLocaleString()}</div>
                    </div>
                  </div>
                );
              }
              if(msg.type==="payment_card"){
                const m=msg.metadata||{};
                return(
                  <div key={msg.id||i} style={{marginBottom:10,display:"flex",justifyContent:"flex-end"}}>
                    <div style={{background:"rgba(10,107,62,0.15)",border:"1px solid rgba(77,217,148,0.2)",borderRadius:12,padding:"10px 14px",maxWidth:"75%"}}>
                      <div style={{fontSize:9,fontWeight:800,color:"#4DD994",marginBottom:4}}>💳 Payment Request Sent</div>
                      <div style={{fontFamily:"'Fraunces',serif",fontSize:18,fontWeight:900,color:"#4DD994"}}>{parseFloat(m.amount||0).toLocaleString()} {m.currency||"NGN"}</div>
                      <div style={{fontSize:9,color:"rgba(255,255,255,0.25)",marginTop:4}}>{new Date(msg.created_at).toLocaleString()}</div>
                    </div>
                  </div>
                );
              }
              return(
                <div key={msg.id||i} style={{marginBottom:8,display:"flex",justifyContent:isMe?"flex-end":"flex-start"}}>
                  <div style={{maxWidth:"78%"}}>
                    {!isMe&&<div style={{fontSize:9,fontWeight:700,color:"rgba(255,255,255,0.4)",marginBottom:2}}>Customer</div>}
                    <div style={{background:isMe?"#0A6B3E":"rgba(255,255,255,0.07)",color:"#FEFCF7",padding:"9px 13px",borderRadius:isMe?"12px 12px 4px 12px":"12px 12px 12px 4px",fontSize:12,lineHeight:1.5}}>
                      {msg.flagged?<span style={{color:"#E74C3C",fontStyle:"italic"}}>⚠️ Blocked by platform</span>:msg.content}
                    </div>
                    <div style={{fontSize:9,color:"rgba(255,255,255,0.2)",marginTop:2,textAlign:isMe?"right":"left"}}>
                      {new Date(msg.created_at).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}
                      {isMe&&" · "}{isMe&&(msg.read_by_customer?"Seen":"Sent")}
                    </div>
                  </div>
                </div>
              );
            })}
            <div ref={bottomRef}/>
          </div>

          {/* Filter warning */}
          {filterWarn&&<div style={{margin:"0 20px 8px",padding:"8px 12px",background:"rgba(192,57,43,0.1)",border:"1px solid rgba(192,57,43,0.2)",borderRadius:8,fontSize:11,color:"#E74C3C",lineHeight:1.5}}>⚠️ {filterWarn}</div>}

          {/* Pay card input */}
          {showPayCard&&(
            <div style={{margin:"0 20px 8px",padding:"12px",background:"#141008",border:"1px solid rgba(255,255,255,0.07)",borderRadius:10,display:"flex",gap:8,alignItems:"center"}}>
              <input value={payAmount} onChange={e=>setPayAmount(e.target.value)} type="number" placeholder="Amount (NGN)"
                style={{flex:1,padding:"8px 12px",borderRadius:8,border:"1px solid rgba(255,255,255,0.1)",background:"rgba(255,255,255,0.05)",color:"#FEFCF7",fontFamily:"Outfit,sans-serif",fontSize:12,outline:"none"}}/>
              <button onClick={sendPayCard} style={{padding:"8px 14px",borderRadius:8,border:"none",background:"#4DD994",color:"#03311A",fontWeight:800,fontSize:11,cursor:"pointer",fontFamily:"Outfit,sans-serif"}}>Send</button>
              <button onClick={()=>setShowPayCard(false)} style={{background:"none",border:"none",color:"rgba(255,255,255,0.3)",cursor:"pointer",fontSize:18}}>×</button>
            </div>
          )}

          {/* Input bar */}
          <div style={{padding:"10px 20px 20px",background:"#141008",borderTop:"1px solid rgba(255,255,255,0.06)",flexShrink:0,display:"flex",gap:8,alignItems:"flex-end"}}>
            <button onClick={()=>setShowPayCard(!showPayCard)}
              style={{width:40,height:40,borderRadius:9,border:"1px solid rgba(255,255,255,0.1)",background:"rgba(255,255,255,0.04)",cursor:"pointer",fontSize:16,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>
              💳
            </button>
            <textarea value={input} onChange={e=>setInput(e.target.value)}
              onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}}}
              placeholder="Type a message to your customer…" rows={2}
              style={{flex:1,padding:"10px 12px",borderRadius:10,border:"1px solid rgba(255,255,255,0.1)",background:"rgba(255,255,255,0.05)",color:"#FEFCF7",fontFamily:"Outfit,sans-serif",fontSize:13,resize:"none",outline:"none"}}/>
            <button onClick={send} disabled={!input.trim()||sending}

              {sending?"…":"Send →"}
            </button>
          </div>
        </div>
      );
    }


    // ── SERVICES SCREEN ───────────────────────────────────────────────────────
    function ServicesScreen({biz}){
      const[services,setServices]=React.useState([]);
      const[loading,setLoading]=React.useState(true);
      const[showAdd,setShowAdd]=React.useState(false);
      const[saving,setSaving]=React.useState(false);
      const[toast,setToast]=React.useState(null);
      const[form,setForm]=React.useState({name:"",description:"",price:"",currency:"NGN",duration_mins:60});
      const showToast=(msg,type="success")=>{setToast({msg,type});setTimeout(()=>setToast(null),3000);};
      React.useEffect(()=>{
        if(!biz?.id) return;
        sb.from("services").select("*").eq("business_id",biz.id).order("created_at",{ascending:false})
          .then(({data})=>{if(data)setServices(data);setLoading(false);});
      },[biz?.id]);
      const addService=async()=>{
        if(!form.name||!form.price){showToast("Name and price required","error");return;}
        setSaving(true);
        const{data,error}=await sb.from("services").insert({
          business_id:biz.id,listing_id:biz.listing_id||null,
          name:form.name,description:form.description,
          price:parseFloat(form.price),currency:form.currency,
          duration_mins:parseInt(form.duration_mins)||60,available:true,
        }).select().single();
        if(error){showToast("Failed: "+error.message,"error");}
        else{
          setServices(prev=>[data,...prev]);setShowAdd(false);
          setForm({name:"",description:"",price:"",currency:"NGN",duration_mins:60});
          if(biz.listing_id){
            const allSvcs=[data,...services].map(s=>({name:s.name,price:s.price,currency:s.currency}));
            await sb.from("listings").update({services:allSvcs}).eq("id",biz.listing_id);
          }
          showToast("Service added — now visible on Xairod");
        }
        setSaving(false);
      };
      const toggleAvail=async(svc)=>{
        await sb.from("services").update({available:!svc.available}).eq("id",svc.id);
        setServices(prev=>prev.map(s=>s.id===svc.id?{...s,available:!s.available}:s));
      };
      const deleteSvc=async(id)=>{
        if(!confirm("Delete this service?")) return;
        await sb.from("services").delete().eq("id",id);
        setServices(prev=>prev.filter(s=>s.id!==id));
      };
      return(
        <div style={{padding:"24px 28px 48px"}}>
          {toast&&<div style={{padding:"10px 14px",borderRadius:8,marginBottom:16,fontSize:12,fontWeight:600,background:toast.type==="success"?"rgba(77,217,148,0.1)":"rgba(192,57,43,0.1)",border:"1px solid "+(toast.type==="success"?"rgba(77,217,148,0.2)":"rgba(192,57,43,0.2)"),color:toast.type==="success"?"#4DD994":"#E74C3C"}}>{toast.msg}</div>}
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
            <div>
              <div style={{fontFamily:"'Fraunces',serif",fontSize:22,fontWeight:900,color:"#FEFCF7"}}>Services</div>
              <div style={{fontSize:11,color:"rgba(255,255,255,0.3)",marginTop:2}}>Services you add here appear live on your Xairod listing</div>
            </div>
            <button onClick={()=>setShowAdd(true)} className="btn-primary" style={{padding:"9px 18px",fontSize:12}}>+ Add Service</button>
          </div>
          {loading?<div style={{color:"rgba(255,255,255,0.3)",padding:40,textAlign:"center"}}>Loading…</div>:
          services.length===0?(
            <div style={{textAlign:"center",padding:"48px 0"}}>
              <div style={{fontSize:48,marginBottom:12}}>🛎️</div>
              <div style={{fontFamily:"'Fraunces',serif",fontSize:18,fontWeight:800,color:"rgba(255,255,255,0.4)",marginBottom:6}}>No services yet</div>
              <div style={{fontSize:12,color:"rgba(255,255,255,0.25)",marginBottom:16}}>Add your services so users know what you offer and at what price.</div>
              <button onClick={()=>setShowAdd(true)} className="btn-primary">+ Add First Service</button>
            </div>
          ):services.map(svc=>(
            <div key={svc.id} style={{background:"#141008",border:"1px solid rgba(255,255,255,0.07)",borderRadius:12,padding:"14px 16px",marginBottom:10,display:"flex",alignItems:"center",gap:14}}>
              <div style={{flex:1}}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:3}}>
                  <div style={{fontSize:13,fontWeight:700,color:"#FEFCF7"}}>{svc.name}</div>
                  <span style={{fontSize:9,padding:"2px 7px",borderRadius:10,fontWeight:800,background:svc.available?"rgba(77,217,148,0.15)":"rgba(255,255,255,0.06)",color:svc.available?"#4DD994":"rgba(255,255,255,0.3)"}}>{svc.available?"Live":"Hidden"}</span>
                </div>
                {svc.description&&<div style={{fontSize:11,color:"rgba(255,255,255,0.4)",marginBottom:4}}>{svc.description}</div>}
                <span style={{fontFamily:"'Fraunces',serif",fontSize:16,fontWeight:900,color:"#4DD994"}}>{parseFloat(svc.price||0).toLocaleString()} {svc.currency||"NGN"}</span>
                <span style={{fontSize:10,color:"rgba(255,255,255,0.3)",marginLeft:8}}>· {svc.duration_mins||60} min</span>
              </div>
              <div style={{display:"flex",gap:6}}>
                <button onClick={()=>toggleAvail(svc)} style={{background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.1)",color:"rgba(255,255,255,0.5)",padding:"5px 10px",borderRadius:7,fontSize:10,fontWeight:700,cursor:"pointer"}}>{svc.available?"Hide":"Show"}</button>
                <button onClick={()=>deleteSvc(svc.id)} style={{background:"rgba(192,57,43,0.1)",border:"1px solid rgba(192,57,43,0.2)",color:"#E74C3C",padding:"5px 10px",borderRadius:7,fontSize:10,fontWeight:700,cursor:"pointer"}}>Delete</button>
              </div>
            </div>
          ))}
          {showAdd&&(
            <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.75)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
              <div style={{background:"#1a1510",border:"1px solid rgba(255,255,255,0.1)",borderRadius:16,padding:24,width:"100%",maxWidth:440}}>
                <div style={{fontFamily:"'Fraunces',serif",fontSize:18,fontWeight:800,color:"#FEFCF7",marginBottom:16}}>Add Service</div>
                {[{label:"Service Name *",key:"name",ph:"e.g. University Application — Full Package"},{label:"Description",key:"description",ph:"What's included?"}].map(f=>(
                  <div key={f.key} style={{marginBottom:12}}>
                    <label className="label">{f.label}</label>
                    <input className="input" value={form[f.key]} onChange={e=>setForm({...form,[f.key]:e.target.value})} placeholder={f.ph}/>
                  </div>
                ))}
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
                  <div><label className="label">Price *</label><input className="input" type="number" value={form.price} onChange={e=>setForm({...form,price:e.target.value})} placeholder="50000"/></div>
                  <div><label className="label">Currency</label>
                    <select className="input" value={form.currency} onChange={e=>setForm({...form,currency:e.target.value})}>
                      <option value="NGN">NGN (₦)</option><option value="EGP">EGP</option><option value="USD">USD</option>
                    </select>
                  </div>
                </div>
                <div style={{marginBottom:16}}>
                  <label className="label">Duration</label>
                  <select className="input" value={form.duration_mins} onChange={e=>setForm({...form,duration_mins:parseInt(e.target.value)})}>
                    {[30,60,90,120,180,240,480,1440,0].map(m=><option key={m} value={m}>{m===0?"N/A":m<60?m+"min":Math.floor(m/60)+"h"+(m%60?m%60+"m":"")}</option>)}
                  </select>
                </div>
                <div style={{display:"flex",gap:10}}>
                  <button onClick={()=>setShowAdd(false)} className="btn-outline" style={{flex:1}}>Cancel</button>
                  <button onClick={addService} disabled={saving} className="btn-primary" style={{flex:2}}>{saving?"Adding…":"Add Service →"}</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function AvailabilityScreen({biz}){
      const DAYS=[{k:"mon",l:"Monday"},{k:"tue",l:"Tuesday"},{k:"wed",l:"Wednesday"},{k:"thu",l:"Thursday"},{k:"fri",l:"Friday"},{k:"sat",l:"Saturday"},{k:"sun",l:"Sunday"}];
      const[hours,setHours]=React.useState({mon:{open:true,from:"09:00",to:"17:00"},tue:{open:true,from:"09:00",to:"17:00"},wed:{open:true,from:"09:00",to:"17:00"},thu:{open:true,from:"09:00",to:"17:00"},fri:{open:true,from:"09:00",to:"17:00"},sat:{open:false,from:"10:00",to:"14:00"},sun:{open:false,from:"10:00",to:"14:00"}});
      const[blocked,setBlocked]=React.useState([]);
      const[newBlock,setNewBlock]=React.useState("");
      const[saving,setSaving]=React.useState(false);
      const[saved,setSaved]=React.useState(false);
      React.useEffect(()=>{
        if(!biz?.id) return;
        if(biz.listing_id) sb.from("listings").select("opening_hours").eq("id",biz.listing_id).single().then(({data})=>{if(data?.opening_hours&&Object.keys(data.opening_hours).length>0)setHours(data.opening_hours);});
        sb.from("booking_slots").select("slot_date").eq("business_id",biz.id).eq("is_blocked",true).then(({data})=>{if(data)setBlocked(data.map(d=>d.slot_date));});
      },[biz?.id]);
      const saveHours=async()=>{
        setSaving(true);
        await sb.from("business_accounts").update({opening_hours:hours}).eq("id",biz.id);
        if(biz.listing_id) await sb.from("listings").update({opening_hours:hours}).eq("id",biz.listing_id);
        setSaving(false);setSaved(true);setTimeout(()=>setSaved(false),2500);
      };
      const blockDate=async()=>{
        if(!newBlock) return;
        await sb.from("booking_slots").insert({business_id:biz.id,slot_date:newBlock,is_blocked:true});
        setBlocked(p=>[...p,newBlock]);setNewBlock("");
      };
      const unblock=async(d)=>{
        await sb.from("booking_slots").delete().eq("business_id",biz.id).eq("slot_date",d).eq("is_blocked",true);
        setBlocked(p=>p.filter(x=>x!==d));
      };
      return(
        <div style={{padding:"24px 28px 48px"}}>
          <div style={{fontFamily:"'Fraunces',serif",fontSize:22,fontWeight:900,color:"#FEFCF7",marginBottom:4}}>Availability</div>
          <div style={{fontSize:11,color:"rgba(255,255,255,0.3)",marginBottom:20}}>Set opening hours and block unavailable dates</div>
          <div style={{background:"#141008",border:"1px solid rgba(255,255,255,0.07)",borderRadius:14,padding:20,marginBottom:16}}>
            <div style={{fontSize:12,fontWeight:800,color:"#FEFCF7",marginBottom:16}}>Opening Hours</div>
            {DAYS.map(day=>(
              <div key={day.k} style={{display:"flex",alignItems:"center",gap:12,marginBottom:10,paddingBottom:10,borderBottom:"1px solid rgba(255,255,255,0.04)"}}>
                <div style={{width:90,fontSize:12,fontWeight:600,color:hours[day.k]?.open?"#FEFCF7":"rgba(255,255,255,0.25)"}}>{day.l}</div>
                <button onClick={()=>setHours(h=>({...h,[day.k]:{...h[day.k],open:!h[day.k]?.open}}))}
                  style={{width:40,height:22,borderRadius:11,background:hours[day.k]?.open?"#4DD994":"rgba(255,255,255,0.1)",border:"none",cursor:"pointer",position:"relative",transition:"background 0.2s",flexShrink:0}}>
                  <div style={{width:16,height:16,borderRadius:"50%",background:"white",position:"absolute",top:3,left:hours[day.k]?.open?21:3,transition:"left 0.2s"}}/>
                </button>
                {hours[day.k]?.open?(
                  <div style={{display:"flex",alignItems:"center",gap:6}}>
                    <input type="time" value={hours[day.k]?.from||"09:00"} onChange={e=>setHours(h=>({...h,[day.k]:{...h[day.k],from:e.target.value}}))} style={{background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:6,color:"#FEFCF7",padding:"3px 7px",fontSize:11}}/>
                    <span style={{color:"rgba(255,255,255,0.3)",fontSize:11}}>to</span>
                    <input type="time" value={hours[day.k]?.to||"17:00"} onChange={e=>setHours(h=>({...h,[day.k]:{...h[day.k],to:e.target.value}}))} style={{background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:6,color:"#FEFCF7",padding:"3px 7px",fontSize:11}}/>
                  </div>
                ):<div style={{fontSize:11,color:"rgba(255,255,255,0.25)"}}>Closed</div>}
              </div>
            ))}
            <button onClick={saveHours} disabled={saving} className="btn-primary" style={{marginTop:4,padding:"9px 20px",fontSize:12}}>
              {saving?"Saving…":saved?"✓ Saved":"Save Hours"}
            </button>
          </div>
          <div style={{background:"#141008",border:"1px solid rgba(255,255,255,0.07)",borderRadius:14,padding:20}}>
            <div style={{fontSize:12,fontWeight:800,color:"#FEFCF7",marginBottom:4}}>Block Dates</div>
            <div style={{fontSize:11,color:"rgba(255,255,255,0.3)",marginBottom:12}}>Users won't be able to book on these dates</div>
            <div style={{display:"flex",gap:10,marginBottom:14}}>
              <input type="date" value={newBlock} onChange={e=>setNewBlock(e.target.value)} style={{flex:1,background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:8,color:"#FEFCF7",padding:"8px 12px",fontSize:12}}/>
              <button onClick={blockDate} disabled={!newBlock} style={{padding:"8px 16px",borderRadius:8,border:"none",background:"#C0392B",color:"white",fontWeight:700,fontSize:12,cursor:"pointer",opacity:newBlock?1:0.4}}>Block</button>
            </div>
            <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
              {blocked.length===0?<div style={{fontSize:11,color:"rgba(255,255,255,0.2)"}}>No dates blocked</div>:
              blocked.map(d=>(
                <div key={d} style={{background:"rgba(192,57,43,0.1)",border:"1px solid rgba(192,57,43,0.2)",borderRadius:8,padding:"5px 10px",display:"flex",alignItems:"center",gap:7}}>
                  <span style={{fontSize:11,color:"#E74C3C",fontWeight:700}}>{new Date(d+"T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"})}</span>
                  <button onClick={()=>unblock(d)} style={{background:"none",border:"none",color:"rgba(255,255,255,0.3)",cursor:"pointer",fontSize:14}}>×</button>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    function CustomersScreen({biz}){
      const[requests,setRequests]=React.useState([]);
      const[loading,setLoading]=React.useState(true);
      const[search,setSearch]=React.useState("");
      React.useEffect(()=>{
        if(!biz?.id) return;
        sb.from("service_requests").select("*,profiles(name,email,city)").eq("assigned_business_id",biz.id).order("created_at",{ascending:false})
          .then(({data})=>{if(data)setRequests(data);setLoading(false);});
      },[biz?.id]);
      const custMap={};
      requests.forEach(r=>{
        if(!custMap[r.user_id]){custMap[r.user_id]={id:r.user_id,name:r.profiles?.name||"User",email:r.profiles?.email||"—",city:r.profiles?.city||"—",count:0,completed:0,last:r.created_at};}
        custMap[r.user_id].count++;
        if(r.status==="completed")custMap[r.user_id].completed++;
      });
      const customers=Object.values(custMap).filter(cu=>!search||cu.name.toLowerCase().includes(search.toLowerCase()));
      return(
        <div style={{padding:"24px 28px 48px"}}>
          <div style={{fontFamily:"'Fraunces',serif",fontSize:22,fontWeight:900,color:"#FEFCF7",marginBottom:4}}>Customers</div>
          <div style={{fontSize:11,color:"rgba(255,255,255,0.3)",marginBottom:20}}>All users who have sent you booking requests</div>
          <input className="input" placeholder="Search customers…" value={search} onChange={e=>setSearch(e.target.value)} style={{marginBottom:16}}/>
          {loading?<div style={{color:"rgba(255,255,255,0.3)",padding:40,textAlign:"center"}}>Loading…</div>:
          customers.length===0?(
            <div style={{textAlign:"center",padding:"48px 0"}}>
              <div style={{fontSize:48,marginBottom:12}}>👥</div>
              <div style={{fontFamily:"'Fraunces',serif",fontSize:18,fontWeight:800,color:"rgba(255,255,255,0.4)"}}>No customers yet</div>
              <div style={{fontSize:12,color:"rgba(255,255,255,0.25)",marginTop:6}}>When users send requests they appear here.</div>
            </div>
          ):customers.map(cu=>(
            <div key={cu.id} style={{background:"#141008",border:"1px solid rgba(255,255,255,0.07)",borderRadius:12,padding:"14px 16px",marginBottom:10,display:"flex",alignItems:"center",gap:14}}>
              <div style={{width:40,height:40,borderRadius:"50%",background:"#0A6B3E",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,fontWeight:800,color:"white",flexShrink:0}}>{cu.name[0]?.toUpperCase()||"?"}</div>
              <div style={{flex:1}}>
                <div style={{fontSize:13,fontWeight:700,color:"#FEFCF7",marginBottom:2}}>{cu.name}</div>
                <div style={{fontSize:10,color:"rgba(255,255,255,0.35)"}}>{cu.email} · {cu.city}</div>
              </div>
              <div style={{textAlign:"right"}}>
                <div style={{fontSize:12,fontWeight:800,color:"#4DD994"}}>{cu.count} request{cu.count!==1?"s":""}</div>
                <div style={{fontSize:10,color:"rgba(255,255,255,0.3)"}}>{cu.completed} completed</div>
              </div>
            </div>
          ))}
        </div>
      );
    }


// ── MAIN APP ──────────────────────────────────────────────────────────────────
function App(){
  const[authUser,setAuthUser]=useState(null);
  const[biz,setBiz]=useState(null);
  const[page,setPage]=useState("dashboard");
  const[requests,setRequests]=useState([]);
  const[bookings,setBookings]=useState([]);
  const[loading,setLoading]=useState(true);
  const[sidebarOpen,setSidebarOpen]=useState(false);

  useEffect(()=>{
    sb.auth.getSession().then(async({data:{session}})=>{
      if(session?.user){
        const{data:bizData}=await sb.from("business_accounts").select("*").eq("user_id",session.user.id).single();
        if(bizData){
          setAuthUser(session.user);setBiz(bizData);await loadData(bizData.id);
          // Realtime: reload when new booking arrives
          sb.channel("biz_bookings_"+bizData.id)
            .on("postgres_changes",{event:"INSERT",schema:"public",table:"bookings",filter:"business_id=eq."+bizData.id},
              async()=>{await loadData(bizData.id);})
            .on("postgres_changes",{event:"INSERT",schema:"public",table:"chat_rooms",filter:"business_id=eq."+bizData.id},
              async()=>{await loadData(bizData.id);})
            .subscribe();
        }
      }
      setLoading(false);
    });
  },[]);

  const loadData=async(bizId)=>{
    // Requests — only show open/quoted (not in_progress — those become bookings)
    const{data:reqs}=await sb.from("service_requests")
      .select("*")
      .eq("assigned_business_id",bizId)
      .in("status",["open","quoted","new"])
      .order("created_at",{ascending:false});
    setRequests(reqs||[]);
    // Bookings — paid and confirmed
    const{data:bks}=await sb.from("bookings")
      .select("*")
      .eq("business_id",bizId)
      .order("created_at",{ascending:false});
    setBookings(bks||[]);
  };

  const signOut=async()=>{await sb.auth.signOut();setAuthUser(null);setBiz(null);setRequests([]);setBookings([]);};

  const handleAuth=(user,bizData)=>{setAuthUser(user);setBiz(bizData);loadData(bizData.id);};

  if(loading)return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{textAlign:"center"}}>
        <div style={{fontFamily:"'Fraunces',serif",fontSize:32,fontWeight:900,color:"#4DD994",marginBottom:12}}>Xairod.</div>
        <div style={{fontSize:12,color:"rgba(255,255,255,0.3)"}}>Loading your business portal…</div>
      </div>
    </div>
  );

  if(!authUser||!biz)return <AuthScreen onAuth={handleAuth}/>;

  const newLeads=requests.filter(r=>r.status==="open").length;

  return(
    <div style={{display:"flex"}}>
      <Sidebar page={page} setPage={setPage} biz={biz} newLeads={newLeads} onSignOut={signOut}/>
      <div className="main-wrap">
        <div className="topbar">
          <div>
            <div style={{fontFamily:"'Fraunces',serif",fontSize:18,fontWeight:800,color:"#FEFCF7"}}>
              {page.charAt(0).toUpperCase()+page.slice(1)}
            </div>
            <div style={{fontSize:10,color:"rgba(255,255,255,0.25)",marginTop:1}}>{new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</div>
          </div>
          <div style={{fontSize:11,color:"rgba(255,255,255,0.3)"}}>{biz.name}</div>
        </div>
        {page==="dashboard"    && <Dashboard biz={biz} requests={requests} bookings={bookings} setPage={setPage}/>}
        {page==="messages"     && <BusinessMessagesScreen biz={biz}/>}
        {page==="requests"     && <RequestsScreen biz={biz} requests={requests} onUpdate={()=>loadData(biz.id)} onGoToMessages={(room)=>{setPage("messages");setTimeout(()=>window.dispatchEvent(new CustomEvent("openRoom",{detail:room})),200);}}/>}
        {page==="bookings"     && <BookingsScreen biz={biz} bookings={bookings} onUpdate={()=>loadData(biz.id)}/>}
        {page==="services"     && <ServicesScreen biz={biz}/>}
        {page==="availability" && <AvailabilityScreen biz={biz}/>}
        {page==="customers"    && <CustomersScreen biz={biz}/>}
        {page==="payouts"      && <PayoutsScreen biz={biz} bookings={bookings}/>}
        {page==="listing"      && <ListingScreen biz={biz} onUpdate={()=>loadData(biz.id)}/>}
        {page==="settings"&&<SettingsScreen biz={biz}/>}
      </div>
    </div>
  );
}

function SettingsScreen({biz}){
  const[phone,setPhone]=React.useState(biz?.phone||"");
  const[phoneSaved,setPhoneSaved]=React.useState(false);
  const savePhone=async()=>{
    await sb.from("business_accounts").update({phone}).eq("id",biz.id);
    setPhoneSaved(true);setTimeout(()=>setPhoneSaved(false),2500);
  };
  return(
    <div className="content">
      <div style={{fontFamily:"'Fraunces',serif",fontSize:22,fontWeight:900,color:"#FEFCF7",marginBottom:20}}>Settings</div>
      <div style={{background:"#141008",border:"1px solid rgba(255,255,255,0.07)",borderRadius:14,padding:20,marginBottom:16}}>
        <div style={{fontSize:12,fontWeight:800,color:"#FEFCF7",marginBottom:4}}>📞 Contact Number (Private)</div>
        <div style={{fontSize:11,color:"rgba(255,255,255,0.3)",marginBottom:14}}>
          Your WhatsApp or phone number. <strong style={{color:"#F5C550"}}>Never shown publicly.</strong> Only visible to Xairod admins for coordination and support.
        </div>
        <div style={{display:"flex",gap:10}}>
          <input className="input" style={{flex:1}} value={phone} onChange={e=>setPhone(e.target.value)} placeholder="+234 800 000 0000"/>
          <button onClick={savePhone} style={{padding:"9px 18px",borderRadius:9,border:"none",background:"#4DD994",color:"#03311A",fontWeight:800,fontSize:12,cursor:"pointer",fontFamily:"'Outfit',sans-serif",flexShrink:0}}>
            {phoneSaved?"✓ Saved":"Save"}
          </button>
        </div>
      </div>
      <div className="card">
        <div style={{fontSize:12,color:"rgba(255,255,255,0.4)",lineHeight:1.7}}>
          Need help? Contact <span style={{color:"#4DD994"}}>hello@xairod.com</span> or message <span style={{color:"#4DD994"}}>t.me/ckairod</span>
        </div>
      </div>
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
