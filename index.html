<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Xairod Business Portal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--g:#0A6B3E;--bg:#0D0A05;--card:#141008;--bdr:rgba(255,255,255,0.07);--sub:rgba(255,255,255,0.35);--txt:#FEFCF7;--gold:#C8861A;--red:#C0392B;--green:#4DD994;}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;}
.hidden{display:none!important;}
/* AUTH */
#auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.auth-box{background:var(--card);border:1px solid var(--bdr);border-radius:20px;padding:32px;width:100%;max-width:420px;}
.logo{font-family:'Fraunces',serif;font-size:26px;font-weight:900;margin-bottom:4px;}
.logo .x{color:var(--green)}.logo .d{color:var(--gold)}
.form-group{margin-bottom:14px;}
label{display:block;font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.7px;margin-bottom:5px;}
input,select,textarea{width:100%;padding:10px 13px;border-radius:10px;border:1px solid var(--bdr);background:rgba(255,255,255,0.05);color:var(--txt);font-family:'Outfit',sans-serif;font-size:13px;outline:none;}
input:focus,select:focus,textarea:focus{border-color:var(--green);}
select option{background:#1a1510;}
.btn{padding:11px 22px;border-radius:10px;border:none;font-family:'Outfit',sans-serif;font-weight:800;font-size:13px;cursor:pointer;width:100%;margin-top:4px;}
.btn-primary{background:var(--green);color:#03311A;}
.btn-outline{background:transparent;border:1px solid var(--bdr);color:var(--sub);}
.btn-sm{width:auto;padding:6px 14px;font-size:12px;margin-top:0;}
.btn-danger{background:rgba(192,57,43,0.15);color:var(--red);border:1px solid rgba(192,57,43,0.25);}
.alert{padding:10px 14px;border-radius:9px;font-size:12px;font-weight:600;margin-bottom:12px;}
.alert-error{background:rgba(192,57,43,0.1);border:1px solid rgba(192,57,43,0.2);color:var(--red);}
.alert-success{background:rgba(77,217,148,0.08);border:1px solid rgba(77,217,148,0.15);color:var(--green);}
.alert-warn{background:rgba(200,134,26,0.1);border:1px solid rgba(200,134,26,0.2);color:#F5C550;}
.link-btn{background:none;border:none;color:var(--green);cursor:pointer;font-family:'Outfit',sans-serif;font-size:13px;font-weight:700;}
/* APP LAYOUT */
#app-screen{display:flex;min-height:100vh;}
.sidebar{width:220px;background:var(--card);border-right:1px solid var(--bdr);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:100;transition:transform .25s;}
.sidebar-logo{padding:20px 18px;border-bottom:1px solid var(--bdr);}
.sidebar-logo .name{font-family:'Fraunces',serif;font-size:20px;font-weight:900;}
.sidebar-logo .sub{font-size:10px;color:var(--sub);margin-top:2px;}
.sidebar-logo .biz-name{font-size:12px;font-weight:700;color:var(--txt);margin-top:8px;}
nav{flex:1;padding:10px 0;}
.nav-item{width:100%;display:flex;align-items:center;gap:10px;padding:10px 18px;background:none;border:none;color:var(--sub);font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;cursor:pointer;text-align:left;transition:all .15s;}
.nav-item:hover{background:rgba(255,255,255,0.04);color:var(--txt);}
.nav-item.active{background:rgba(77,217,148,0.08);color:var(--green);border-right:2px solid var(--green);}
.nav-icon{font-size:16px;width:20px;text-align:center;}
.nav-badge{background:var(--red);color:#fff;font-size:9px;font-weight:800;padding:2px 6px;border-radius:10px;margin-left:auto;}
.sidebar-footer{padding:16px 18px;border-top:1px solid var(--bdr);}
.main{margin-left:220px;flex:1;}
.topbar{padding:14px 28px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;background:var(--card);position:sticky;top:0;z-index:50;}
.page-title{font-family:'Fraunces',serif;font-size:18px;font-weight:800;}
.topbar-right{font-size:11px;color:var(--sub);}
.content{padding:24px 28px 48px;}
/* CARDS */
.card{background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:20px;margin-bottom:16px;}
.card-title{font-size:12px;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:1px;margin-bottom:16px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:20px;}
.grid-4{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat-card{background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:18px;cursor:pointer;}
.stat-num{font-family:'Fraunces',serif;font-size:24px;font-weight:900;color:var(--green);margin-bottom:4px;}
.stat-label{font-size:11px;color:var(--sub);}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;}
.pill-green{background:rgba(77,217,148,0.15);color:var(--green);}
.pill-gold{background:rgba(200,134,26,0.15);color:#F5C550;}
.pill-red{background:rgba(192,57,43,0.15);color:var(--red);}
.pill-gray{background:rgba(255,255,255,0.06);color:var(--sub);}
/* REQUEST CARDS */
.req-card{border-left:4px solid #888;padding:16px;border-radius:0 12px 12px 0;background:var(--card);border-top:1px solid var(--bdr);border-right:1px solid var(--bdr);border-bottom:1px solid var(--bdr);margin-bottom:10px;}
.req-card.open{border-left-color:#888;}
.req-card.quoted{border-left-color:#F5C550;}
.req-card.in_progress{border-left-color:var(--green);}
/* IMAGE GRID */
.img-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
.img-slot{aspect-ratio:4/3;border-radius:10px;overflow:hidden;border:1px solid var(--bdr);position:relative;}
.img-slot img{width:100%;height:100%;object-fit:cover;}
.img-cover-badge{position:absolute;top:6px;left:6px;background:var(--green);color:#03311A;font-size:8px;font-weight:800;padding:2px 7px;border-radius:4px;}
.img-del{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,0.6);border:none;color:#fff;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;}
.img-add{aspect-ratio:4/3;border-radius:10px;border:1.5px dashed var(--bdr);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;gap:6px;background:rgba(255,255,255,0.02);}
.img-add span{font-size:24px;}
.img-add p{font-size:10px;color:var(--sub);font-weight:600;}
/* TABLE */
table{width:100%;border-collapse:collapse;font-size:12px;}
th{text-align:left;padding:8px 12px;color:var(--sub);font-size:10px;font-weight:700;text-transform:uppercase;border-bottom:1px solid var(--bdr);}
td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,0.04);vertical-align:middle;}
/* EMPTY */
.empty{text-align:center;padding:48px 0;}
.empty-icon{font-size:48px;margin-bottom:12px;}
.empty-title{font-family:'Fraunces',serif;font-size:18px;font-weight:800;color:var(--sub);margin-bottom:6px;}
.empty-sub{font-size:12px;color:rgba(255,255,255,0.2);}
/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:#1a1510;border:1px solid var(--bdr);border-radius:16px;padding:24px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;}
.modal-title{font-family:'Fraunces',serif;font-size:18px;font-weight:800;margin-bottom:16px;}
/* CHAT */
.chat-msgs{flex:1;overflow-y:auto;padding-bottom:10px;}
.msg-row{display:flex;margin-bottom:10px;}
.msg-row.me{justify-content:flex-end;}
.msg-bubble{max-width:75%;padding:9px 13px;border-radius:12px;font-size:12px;line-height:1.55;}
.msg-bubble.me{background:var(--g);border-radius:12px 12px 4px 12px;}
.msg-bubble.them{background:rgba(255,255,255,0.07);border-radius:12px 12px 12px 4px;}
.msg-bubble.system{background:rgba(200,134,26,0.08);border:1px solid rgba(200,134,26,0.15);color:#F5C550;font-style:italic;border-radius:12px;}
/* TOGGLE */
.toggle-btn{width:40px;height:22px;border-radius:11px;border:none;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0;}
.toggle-dot{width:16px;height:16px;border-radius:50%;background:#fff;position:absolute;top:3px;transition:left .2s;}
/* TOAST */
.toast{position:fixed;top:20px;right:20px;z-index:999;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 4px 20px rgba(0,0,0,0.3);max-width:320px;}
/* MOBILE */
.mob-bar{display:none;background:var(--card);padding:12px 16px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bdr);position:fixed;top:0;left:0;right:0;z-index:150;}
.overlay-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:99;}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .overlay-bg.open{display:block;}
  .main{margin-left:0;}
  .mob-bar{display:flex;}
  .content{padding:16px 16px 80px;}
  .topbar{margin-top:50px;}
  .grid-3{grid-template-columns:1fr 1fr;}
  .grid-2{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth-screen">
  <div class="auth-box">
    <div class="logo"><span class="x">X</span>airod<span class="d">.</span></div>
    <p style="font-size:12px;color:var(--sub);margin-bottom:24px;">Business Portal</p>
    <div id="auth-error" class="alert alert-error hidden"></div>
    <div class="form-group"><label>Email</label><input type="email" id="auth-email" placeholder="business@email.com"/></div>
    <div class="form-group"><label>Password</label><input type="password" id="auth-pass" placeholder="••••••••"/></div>
    <button class="btn btn-primary" id="btn-login">Sign In →</button>
    <p style="font-size:12px;color:var(--sub);text-align:center;margin-top:14px;">New business? <button class="link-btn" id="go-register">Register here</button></p>

    <!-- REGISTER -->
    <div id="reg-panel" class="hidden" style="margin-top:16px;padding-top:16px;border-top:1px solid var(--bdr);">
      <p style="font-size:13px;font-weight:700;color:var(--sub);margin-bottom:14px;">Partner Registration</p>
      <div class="form-group"><label>Business Name *</label><input type="text" id="reg-name" placeholder="Your business name"/></div>
      <div class="grid-2">
        <div class="form-group"><label>Category *</label>
          <select id="reg-cat">
            <option value="health">Health</option>
            <option value="food">Food & Restaurant</option>
            <option value="travel">Tourism & Travel</option>
            <option value="housing">Housing</option>
            <option value="school">Schools & Agencies</option>
            <option value="agency">Admission Agency</option>
            <option value="language">Language School</option>
          </select>
        </div>
        <div class="form-group"><label>City *</label><input type="text" id="reg-city" placeholder="Cairo, Egypt"/></div>
      </div>
      <div class="form-group"><label>Description</label><textarea id="reg-desc" rows="2" placeholder="What do you offer?"></textarea></div>
      <div class="form-group"><label>KYC Documents (ID + Business Reg) *</label><input type="file" id="reg-docs" multiple accept=".pdf,.jpg,.jpeg,.png" style="color:var(--sub);font-size:12px;"/></div>
      <div style="display:flex;gap:8px;align-items:flex-start;margin-bottom:14px;">
        <input type="checkbox" id="reg-agree" style="width:auto;margin-top:3px;"/>
        <label for="reg-agree" style="font-size:11px;color:var(--sub);text-transform:none;letter-spacing:0;cursor:pointer;">I agree to the <a href="https://www.xairod.com/terms" target="_blank" style="color:var(--green);">Terms & Conditions</a></label>
      </div>
      <button class="btn btn-primary" id="btn-register">Submit Application →</button>
      <p style="font-size:11px;color:var(--sub);text-align:center;margin-top:10px;"><button class="link-btn" id="go-login" style="font-size:11px;">Already registered? Sign in</button></p>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app-screen" class="hidden">
  <div class="overlay-bg" id="mob-overlay"></div>
  <div class="mob-bar">
    <button id="mob-menu" style="background:none;border:none;color:var(--txt);font-size:22px;cursor:pointer;">☰</button>
    <div class="logo" style="font-size:18px;"><span class="x">X</span>airod<span class="d">.</span></div>
    <div style="width:30px;"></div>
  </div>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo" style="font-size:20px;"><span class="x">X</span>airod<span class="d">.</span></div>
      <div class="sub">Business Portal</div>
      <div class="biz-name" id="sb-biz-name">—</div>
      <div id="sb-biz-status" style="font-size:10px;margin-top:2px;"></div>
    </div>
    <nav id="main-nav">
      <button class="nav-item active" data-page="dashboard"><span class="nav-icon">⊞</span>Dashboard</button>
      <button class="nav-item" data-page="messages"><span class="nav-icon">💬</span>Messages</button>
      <button class="nav-item" data-page="requests"><span class="nav-icon">📥</span>Requests<span class="nav-badge hidden" id="badge-requests">0</span></button>
      <button class="nav-item" data-page="bookings"><span class="nav-icon">✅</span>Bookings</button>
      <button class="nav-item" data-page="services"><span class="nav-icon">🛎️</span>Services</button>
      <button class="nav-item" data-page="availability"><span class="nav-icon">📅</span>Availability</button>
      <button class="nav-item" data-page="customers"><span class="nav-icon">👥</span>Customers</button>
      <button class="nav-item" data-page="payouts"><span class="nav-icon">💰</span>Payouts</button>
      <button class="nav-item" data-page="listing"><span class="nav-icon">🏢</span>My Listing</button>
      <button class="nav-item" data-page="settings"><span class="nav-icon">⚙️</span>Settings</button>
    </nav>
    <div class="sidebar-footer">
      <div id="sb-email" style="font-size:10px;color:var(--sub);margin-bottom:10px;"></div>
      <button class="btn btn-outline btn-sm" id="btn-signout" style="width:100%;">Sign Out</button>
    </div>
  </div>
  <div class="main">
    <div class="topbar">
      <div class="page-title" id="page-title">Dashboard</div>
      <div class="topbar-right" id="topbar-right"></div>
    </div>
    <div class="content" id="page-content"></div>
  </div>
</div>

<!-- MODAL -->
<div class="overlay hidden" id="modal-overlay">
  <div class="modal" id="modal-box"></div>
</div>

<!-- TOAST -->
<div class="toast hidden" id="toast"></div>

<script>
const SUPA_URL = "https://gfvsosvszxwazuqnsavq.supabase.co";
const SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdmdnNvc3Zzenh3YXp1cW5zYXZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwODcxNjAsImV4cCI6MjA5MzY2MzE2MH0.SvSc1IDr_iK8YweQpKarmglQTPV7w2dNkKcbFim_Ztc";
const sb = supabase.createClient(SUPA_URL, SUPA_KEY);

// ── SECURITY: sanitize user content before innerHTML ─────────────────────────
const safe=(str)=>{
  if(!str) return '';
  const d=document.createElement('div');
  d.textContent=String(str);
  return d.innerHTML;
};
// Production logger
const isDev=false; // set true only in development
const devLog=isDev?console.log:()=>{};
const devWarn=isDev?console.warn:()=>{};

let BIZ = null;
let REQUESTS = [];
let BOOKINGS = [];
let CURRENT_PAGE = "dashboard";
let CHAT_CHANNEL = null;

// ── UTILS ─────────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const fmt = n => (n||0).toLocaleString();
const el = (tag, attrs={}, ...children) => {
  const e = document.createElement(tag);
  Object.entries(attrs).forEach(([k,v]) => { if(k==='className') e.className=v; else if(k==='style') Object.assign(e.style,v); else if(k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(),v); else e.setAttribute(k,v); });
  children.forEach(c => c != null && e.append(typeof c==='string' ? c : c));
  return e;
};

function showToast(msg, type='success') {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast';
  t.style.background = type==='error'?'rgba(192,57,43,0.9)':type==='warn'?'rgba(200,134,26,0.9)':'rgba(10,107,62,0.9)';
  t.style.color = '#fff';
  t.style.border = '1px solid rgba(255,255,255,0.2)';
  t.classList.remove('hidden');
  setTimeout(()=>t.classList.add('hidden'), 3000);
}

function showModal(html) { $('modal-box').innerHTML = html; $('modal-overlay').classList.remove('hidden'); }
function closeModal() { $('modal-overlay').classList.add('hidden'); }
$('modal-overlay').addEventListener('click', e => { if(e.target===$('modal-overlay')) closeModal(); });

// ── AUTH ──────────────────────────────────────────────────────────────────────
$('go-register').addEventListener('click', ()=>{ $('reg-panel').classList.remove('hidden'); $('go-register').closest('p').classList.add('hidden'); });
$('go-login').addEventListener('click', ()=>{ $('reg-panel').classList.add('hidden'); $('go-register').closest('p').classList.remove('hidden'); });

$('btn-login').addEventListener('click', async()=>{
  const email=$('auth-email').value.trim(), pass=$('auth-pass').value;
  if(!email||!pass){showAuthErr("Enter email and password.");return;}
  $('btn-login').textContent='Signing in…';
  const{error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error){showAuthErr(error.message);$('btn-login').textContent='Sign In →';return;}
  await loadApp();
});

$('btn-register').addEventListener('click', async()=>{
  const name=$('reg-name').value.trim(), city=$('reg-city').value.trim();
  const email=$('auth-email').value.trim(), pass=$('auth-pass').value;
  const cat=$('reg-cat').value, desc=$('reg-desc').value.trim();
  const docs=$('reg-docs').files;
  if(!name||!email||!pass||!city){showAuthErr("Fill all required fields.");return;}
  if(!$('reg-agree').checked){showAuthErr("Please agree to the terms.");return;}
  if(!docs.length){showAuthErr("Upload at least one KYC document.");return;}
  $('btn-register').textContent='Submitting…';
  try{
    const{data:authData,error:signErr}=await sb.auth.signUp({email,password:pass});
    if(signErr&&!signErr.message.includes('already'))throw signErr;
    await sb.auth.signInWithPassword({email,password:pass});
    const uid=(await sb.auth.getUser()).data.user.id;
    const{data:biz,error:bizErr}=await sb.from('business_accounts').insert({user_id:uid,name,email,category:cat,city,description:desc,status:'pending',kyc_status:'submitted',commission_rate:12}).select().single();
    if(bizErr)throw bizErr;
    for(const doc of docs){
      const fp=`kyc/${biz.id}/${Date.now()}_${doc.name}`;
      await sb.storage.from('kyc-documents').upload(fp,doc);
      await sb.from('kyc_documents').insert({business_id:biz.id,document_type:doc.name,file_path:fp,status:'pending'});
    }
    await loadApp();
  }catch(e){showAuthErr(e.message);$('btn-register').textContent='Submit Application →';}
});

function showAuthErr(msg){ const e=$('auth-error'); e.textContent=msg; e.classList.remove('hidden'); }

$('btn-signout').addEventListener('click', async()=>{ await sb.auth.signOut(); location.reload(); });
$('mob-menu').addEventListener('click', ()=>{ $('sidebar').classList.toggle('open'); $('mob-overlay').classList.toggle('open'); });
$('mob-overlay').addEventListener('click', ()=>{ $('sidebar').classList.remove('open'); $('mob-overlay').classList.remove('open'); });

// ── LOAD APP ──────────────────────────────────────────────────────────────────
async function loadApp(){
  const{data:rows}=await sb.from('business_accounts').select('*').eq('user_id',(await sb.auth.getUser()).data.user.id).limit(1);
  if(!rows||!rows[0]){showAuthErr("No business account found.");await sb.auth.signOut();return;}
  BIZ=rows[0];
  $('auth-screen').classList.add('hidden');
  $('app-screen').classList.remove('hidden');
  $('sb-biz-name').textContent=BIZ.name||'—';
  $('sb-biz-status').innerHTML=BIZ.status==='active'?'<span style="color:var(--green)">● Live</span>':'<span style="color:#F5C550">● Pending Review</span>';
  $('sb-email').textContent=BIZ.email||'';
  $('topbar-right').textContent=BIZ.name;
  setupNav();
  await refreshData();
  navigate('dashboard');
}

async function refreshData(){
  const{data:reqs}=await sb.from('service_requests').select('*').eq('assigned_business_id',BIZ.id).in('status',['open','quoted','new','in_progress']).order('created_at',{ascending:false});
  REQUESTS=reqs||[];
  const openCount=REQUESTS.filter(r=>r.status==='open').length;
  const badge=$('badge-requests');
  badge.textContent=openCount;
  badge.classList.toggle('hidden',openCount===0);
  const{data:bks}=await sb.from('bookings').select('*').eq('business_id',BIZ.id).order('created_at',{ascending:false});
  BOOKINGS=bks||[];
}

// ── NAV ───────────────────────────────────────────────────────────────────────
function setupNav(){
  document.querySelectorAll('.nav-item').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      $('sidebar').classList.remove('open');

    });

}

function navigate(page){
  CURRENT_PAGE=page;
  $('page-title').textContent={dashboard:'Dashboard',messages:'Messages',requests:'Requests',bookings:'Bookings',services:'Services',availability:'Availability',customers:'Customers',payouts:'Payouts',listing:'My Listing',settings:'Settings'}[page]||page;
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
  const c=$('page-content');

  const fns={dashboard:renderDashboard,messages:renderMessages,requests:renderRequests,bookings:renderBookings,services:renderServices,availability:renderAvailability,customers:renderCustomers,payouts:renderPayouts,listing:renderListing,settings:renderSettings};

}

function openQuoteModal(reqId){
  const req=REQUESTS.find(r=>r.id===reqId);
  if(!req) return;
  showModal(`
    <div class="modal-title">Send Quote</div>
    <div style="font-size:12px;color:var(--sub);margin-bottom:16px;">For: ${req.listing_name||'Service'} · ${req.ref||''}</div>
    <div class="grid-2">
      <div class="form-group"><label>Price (NGN) *</label><input type="number" id="q-price" placeholder="50000"/></div>
      <div class="form-group"><label>Timeline *</label><input type="text" id="q-timeline" placeholder="e.g. 2 weeks"/></div>
    </div>
    <div class="form-group"><label>Notes (optional)</label><textarea id="q-notes" rows="3" placeholder="What's included…"></textarea></div>
    <div id="q-breakdown" style="background:rgba(77,217,148,0.06);border:1px solid rgba(77,217,148,0.12);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:11px;color:var(--sub);display:none;"></div>
    <div id="q-err" class="alert alert-error hidden"></div>
    <div style="display:flex;gap:10px;margin-top:4px;">
      <button class="btn btn-outline btn-sm" onclick="closeModal()" style="flex:1;">Cancel</button>
      <button class="btn btn-primary btn-sm" onclick="submitQuote('${reqId}')" style="flex:2;">Send Quote →</button>
    </div>
  `);
  $('q-price').addEventListener('input',()=>{
    const p=parseFloat($('q-price').value)||0;
    const comm=BIZ.commission_rate||12;
    const b=$('q-breakdown');
    if(p>0){b.style.display='block';b.textContent=`Your payout: ${fmt(Math.round(p*(1-comm/100)))} NGN after ${comm}% Xairod commission`;}
    else b.style.display='none';
  });
}

async function submitQuote(reqId){
  const price=$('q-price').value, timeline=$('q-timeline').value;
  const err=$('q-err');
  if(!price||!timeline){err.textContent='Price and timeline required.';err.classList.remove('hidden');return;}
  const req=REQUESTS.find(r=>r.id===reqId);
  const gross=parseFloat(price), comm=BIZ.commission_rate||12;
  const commAmt=Math.round(gross*comm/100);
  await sb.from('quotes').insert({request_id:reqId,business_id:BIZ.id,price:gross,commission_rate:comm,commission_amount:commAmt,payout_amount:gross-commAmt,timeline,notes:$('q-notes').value,status:'pending'});
  await sb.from('service_requests').update({status:'quoted',assigned_business_id:BIZ.id}).eq('id',reqId);
  await sb.from('notifications').insert({user_id:req.user_id,icon:'💬',message:`${BIZ.name} sent you a quote of ${fmt(gross)} NGN. Go to My Requests to review.`,type:'quote',metadata:{request_id:reqId}});
  closeModal();showToast('Quote sent!');
  await refreshData();navigate('requests');
}

async function addService(){

const DAYS=[{k:'mon',l:'Monday'},{k:'tue',l:'Tuesday'},{k:'wed',l:'Wednesday'},{k:'thu',l:'Thursday'},{k:'fri',l:'Friday'},{k:'sat',l:'Saturday'},{k:'sun',l:'Sunday'}];
let HOURS={mon:{open:true,from:'09:00',to:'17:00'},tue:{open:true,from:'09:00',to:'17:00'},wed:{open:true,from:'09:00',to:'17:00'},thu:{open:true,from:'09:00',to:'17:00'},fri:{open:true,from:'09:00',to:'17:00'},sat:{open:false,from:'10:00',to:'14:00'},sun:{open:false,from:'10:00',to:'14:00'}};

async function renderAvailability(c){
  if(BIZ.listing_id){const{data}=await sb.from('listings').select('opening_hours').eq('id',BIZ.listing_id).single();if(data?.opening_hours&&Object.keys(data.opening_hours).length)HOURS=data.opening_hours;}
  const{data:bl}=await sb.from('booking_slots').select('slot_date').eq('business_id',BIZ.id).eq('is_blocked',true);

function renderAvailabilityHTML(c){

function renderHoursRows(){

    row.innerHTML=`

      <button class="toggle-btn" id="toggle-${day.k}" style="background:${h.open?'var(--green)':'rgba(255,255,255,0.1)'};" onclick="toggleDay('${day.k}')"><div class="toggle-dot" style="left:${h.open?'21':'3'}px;"></div></button>

        <input type="time" value="${h.to||'17:00'}" id="to-${day.k}" style="background:rgba(255,255,255,0.05);border:1px solid var(--bdr);border-radius:6px;color:var(--txt);padding:3px 7px;font-size:11px;" onchange="updateHour('${day.k}','to',this.value)"/>

function toggleDay(k){
  HOURS[k]={...HOURS[k],open:!HOURS[k].open};
  const btn=$(`toggle-${k}`),times=$(`times-${k}`),closed=$(`closed-${k}`);
  btn.style.background=HOURS[k].open?'var(--green)':'rgba(255,255,255,0.1)';

async function saveHours(){
  await sb.from('business_accounts').update({opening_hours:HOURS}).eq('id',BIZ.id);

        <div class="form-group"><label>Account Number</label><input type="text" id="bank-num" value="${bankForm.account_number}" placeholder="10-digit NUBAN" maxlength="10"/></div>
      </div>
      <div class="grid-2">
        <div class="form-group"><label>Bank Name</label>
          <select id="bank-bank">
            <option value="">Select bank…</option>
            ${['Access Bank','First Bank','GTBank','UBA','Zenith Bank','Fidelity Bank','FCMB','Kuda Bank','Opay','Palmpay','CIB Egypt','Banque Misr','Other'].map(b=>`<option value="${b}"${bankForm.bank_name===b?' selected':''}>${b}</option>`).join('')}
          </select>
        </div>
        <div class="form-group"><label>Currency</label>
          <select id="bank-curr">
            <option value="NGN"${bankForm.currency==='NGN'?' selected':''}>NGN — Naira</option>
            <option value="EGP"${bankForm.currency==='EGP'?' selected':''}>EGP — Egyptian Pound</option>
            <option value="USD"${bankForm.currency==='USD'?' selected':''}>USD</option>
          </select>
        </div>
      </div>
      <div class="form-group"><label>Paystack Recipient Code (optional)</label><input type="text" id="bank-code" value="${bankForm.paystack_recipient_code}" placeholder="RCP_xxxxxxxxxxxx"/></div>
      <button class="btn btn-primary btn-sm" onclick="saveBank()">Save Payout Details</button>
    </div>`;
}
async function saveBank(){
  const bf={account_name:$('bank-name').value,account_number:$('bank-num').value,bank_name:$('bank-bank').value,currency:$('bank-curr').value,paystack_recipient_code:$('bank-code').value};
  await sb.from('business_accounts').update({payout_account:bf}).eq('id',BIZ.id);
  showToast('Payout details saved');
}

// ── MY LISTING ────────────────────────────────────────────────────────────────
let IMAGES=[];
async function renderListing(c){
  const src=BIZ.listing_id?sb.from('listings').select('images').eq('id',BIZ.listing_id).single():sb.from('business_accounts').select('images').eq('id',BIZ.id).single();
  const{data}=await src;
  IMAGES=(data?.images&&Array.isArray(data.images))?data.images:[];
  c.innerHTML=`
    ${BIZ.status==='pending'?`<div class="alert alert-warn">⏳ Under review. Fill details and upload photos now — they go live on approval.</div>`:`<div class="alert alert-success">✓ Your listing is live on xairod.com</div>`}
    <div class="card">
      <div class="card-title">📸 Business Photos</div>
      <div style="font-size:11px;color:var(--sub);margin-bottom:14px;">Up to 6 photos · JPG/PNG/WebP · Max 5MB · First photo = cover image</div>
      <div class="img-grid" id="img-grid"></div>
    </div>
    <div class="card">
      <div class="card-title">Business Details</div>
      <div class="form-group"><label>Business Name</label><input type="text" id="l-name" value="${BIZ.name||''}"/></div>
      <div class="form-group"><label>City / Location</label><input type="text" id="l-city" value="${BIZ.city||''}" placeholder="Cairo, Egypt"/></div>
      <div class="form-group"><label>Description</label><textarea id="l-desc" rows="4">${BIZ.description||''}</textarea></div>
      <button class="btn btn-primary btn-sm" onclick="saveListing()">Save Changes</button>
    </div>`;
  renderImgGrid();
}

function renderImgGrid(){
  const g=$('img-grid');if(!g) return;g.innerHTML='';
  IMAGES.forEach((url,i)=>{
    const slot=document.createElement('div');slot.className='img-slot';
    slot.innerHTML=`<img src="${url}" alt="Photo ${i+1}"/>${i===0?'<div class="img-cover-badge">COVER</div>':''}<button class="img-del" onclick="delImg('${url}')">×</button>`;
    g.appendChild(slot);
  });
  if(IMAGES.length<6){
    const add=document.createElement('label');add.className='img-add';
    add.innerHTML=`<input type="file" accept="image/jpeg,image/png,image/webp" style="display:none;" onchange="uploadImg(this)"/><span>📷</span><p>Add Photo</p>`;
    g.appendChild(add);
  }
}

async function uploadImg(input){
  const file=input.files[0];if(!file) return;
  if(file.size>5*1024*1024){showToast('Max 5MB','error');return;}
  showToast('Uploading…','warn');
  const ext=file.name.split('.').pop().toLowerCase().replace(/[^a-z0-9]/g,''); const fp=`${BIZ.id}/${crypto.randomUUID()}.${ext}`;
  const{error}=await sb.storage.from('listing-images').upload(fp,file,{upsert:false});
  if(error){showToast('Upload failed: '+error.message,'error');return;}
  const{data:ud}=sb.storage.from('listing-images').getPublicUrl(fp);
  IMAGES.push(ud.publicUrl);
  // Save to business_accounts always
  await sb.from('business_accounts').update({images:IMAGES}).eq('id',BIZ.id);
  // Also save to listing if it exists
  if(BIZ.listing_id){
    await sb.from('listings').update({images:IMAGES}).eq('id',BIZ.listing_id);
  } else {
    // Try to find listing by business_id and update it
    const{data:lst}=await sb.from('listings').select('id').eq('business_id',BIZ.id).limit(1);
    if(lst?.[0]){
      await sb.from('listings').update({images:IMAGES}).eq('id',lst[0].id);
      // Cache listing_id
      BIZ.listing_id=lst[0].id;
    }
  }
  showToast('Photo uploaded ✓');renderImgGrid();
}

async function delImg(url){
  IMAGES=IMAGES.filter(i=>i!==url);
  // Save to business_accounts always
  await sb.from('business_accounts').update({images:IMAGES}).eq('id',BIZ.id);
  // Also save to listing if it exists
  if(BIZ.listing_id){
    await sb.from('listings').update({images:IMAGES}).eq('id',BIZ.listing_id);
  } else {
    // Try to find listing by business_id and update it
    const{data:lst}=await sb.from('listings').select('id').eq('business_id',BIZ.id).limit(1);
    if(lst?.[0]){
      await sb.from('listings').update({images:IMAGES}).eq('id',lst[0].id);
      // Cache listing_id
      BIZ.listing_id=lst[0].id;
    }
  }
  const fp=url.split('/listing-images/')[1];
  if(fp) sb.storage.from('listing-images').remove([fp]);
  showToast('Photo removed');renderImgGrid();
}

async function saveListing(){
  const name=$('l-name').value.trim(),city=$('l-city').value.trim(),description=$('l-desc').value.trim();
  await sb.from('business_accounts').update({name,city,description}).eq('id',BIZ.id);
  if(BIZ.listing_id) await sb.from('listings').update({name,city,description}).eq('id',BIZ.listing_id);
  BIZ={...BIZ,name,city,description};$('sb-biz-name').textContent=name;
  showToast('Listing saved and live on Xairod');
}

// ── MESSAGES ──────────────────────────────────────────────────────────────────
let ACTIVE_ROOM=null,CHAT_MSGS=[],BIZ_PENDING_FILE=null;

function fmtBizSize(b){return b>1048576?(b/1048576).toFixed(1)+'MB':(b/1024).toFixed(0)+'KB';}
function isBizImg(name){const e=(name||'').split('.').pop().toLowerCase();return['jpg','jpeg','png','gif','webp','heic'].includes(e);}

async function attachBizFile(input){
  const file=input.files[0];if(!file) return;
  if(file.size>20*1024*1024){showToast('Max 20MB','error');return;}
  // Store raw file — upload happens on Send
  const isImage=isBizImg(file.name)||file.type.startsWith('image/');
  BIZ_PENDING_FILE={rawFile:file,name:file.name,size:file.size,isImage,mimeType:file.type};
  // Show preview
  if(isImage){
    const r=new FileReader();
    r.onload=e=>{BIZ_PENDING_FILE.preview=e.target.result;renderBizFilePreview();};
    r.readAsDataURL(file);
  } else {
    renderBizFilePreview();
  }
  input.value='';
}

function renderBizFilePreview(){
  // Remove old preview
  const old=document.getElementById('biz-file-preview');
  if(old) old.remove();
  if(!BIZ_PENDING_FILE) return;
  const f=BIZ_PENDING_FILE;
  const icon=f.mimeType?.includes('pdf')?'📋':f.mimeType?.includes('word')?'📝':'📄';
  const div=document.createElement('div');
  div.id='biz-file-preview';
  div.style.cssText='margin-bottom:8px;background:rgba(77,217,148,0.06);border:1.5px solid rgba(77,217,148,0.2);border-radius:10px;padding:8px 10px;display:flex;gap:10px;align-items:center;';
  div.innerHTML=`
    ${f.preview?`<img src="${f.preview}" style="width:48px;height:48px;object-fit:cover;border-radius:6px;flex-shrink:0;border:1px solid rgba(255,255,255,0.1);"/>`:
      `<div style="width:48px;height:48px;background:rgba(255,255,255,0.05);border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;">${icon}</div>`}
    <div style="flex:1;min-width:0;">
      <div style="font-size:12px;font-weight:700;color:#FEFCF7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${f.name}</div>
      <div style="font-size:10px;color:rgba(255,255,255,0.35);margin-top:1px;">${fmtBizSize(f.size)} · 📎 Ready — click Send</div>
    </div>
    <button onclick="BIZ_PENDING_FILE=null;renderBizFilePreview();" style="background:none;border:none;color:rgba(255,255,255,0.4);cursor:pointer;font-size:20px;padding:4px;">×</button>`;
  // Insert before the flex row with textarea
  const inputRow=document.querySelector('#chat-input')?.closest('div[style*="display:flex"]');
  if(inputRow) inputRow.parentNode.insertBefore(div,inputRow);
}

async function uploadBizFile(file){
  const ext=(file.name||'').split('.').pop().toLowerCase().replace(/[^a-z0-9]/g,'');
  const ALLOWED=['jpg','jpeg','png','gif','webp','pdf','doc','docx','txt'];
  if(!ALLOWED.includes(ext)){showToast('File type not allowed','error');return null;}
  const fp=`chat/${BIZ.id}/${crypto.randomUUID()}.${ext}`;
  for(const bucket of ['chat-files','listing-images']){
    const{error}=await sb.storage.from(bucket).upload(fp,file,{upsert:false,contentType:file.type});
    if(!error){
      const{data:ud}=sb.storage.from(bucket).getPublicUrl(fp);
      return{url:ud.publicUrl,name:file.name,size:file.size,mimeType:file.type,isImage:isBizImg(file.name)};
    }
    devWarn('Upload failed:',error.message);
  }
  showToast('Upload failed — check connection','error');
  return null;
}
async function renderMessages(c){
  // Load from chat_rooms — this is where room_ids in direct_messages point to
  const{data:rooms,error}=await sb.from('chat_rooms')
    .select('*')
    .or(`business_id.eq.${BIZ.id},business_user_id.eq.${BIZ.user_id}`)
    .order('created_at',{ascending:false});

  if(error) console.warn('chat_rooms error:',error.message);
  if(!rooms||!rooms.length){c.innerHTML=`<div class="empty"><div class="empty-icon">💬</div><div class="empty-title">No conversations yet</div><div class="empty-sub">When you send a quote and the customer accepts, the chat will appear here</div></div>`;return;}
  c.innerHTML=`<div id="room-list"></div>`;
  rooms.forEach(r=>{
    const d=document.createElement('div');d.className='card';d.style.cssText='display:flex;align-items:center;gap:12px;cursor:pointer;';
    d.innerHTML=`<div style="width:40px;height:40px;border-radius:50%;background:rgba(77,217,148,0.1);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;">👤</div><div style="flex:1;"><div style="font-size:13px;font-weight:700;">${safe(r.listing_name)||'Customer Chat'}</div><div style="font-size:10px;color:var(--sub);">Room: ${safe(r.id?.slice(0,8))}</div></div><span style="color:var(--sub);font-size:18px;">›</span>`;
    d.onclick=()=>openChat(r,c);
    $('room-list').appendChild(d);
  });
}

async function openChat(room,container){
  ACTIVE_ROOM=room;
  const{data}=await sb.from('direct_messages').select('*').eq('room_id',room.id).order('created_at',{ascending:true});
  CHAT_MSGS=data||[];
  await sb.from('direct_messages').update({read_by_business:true}).eq('room_id',room.id).neq('sender_role','business');
  container.innerHTML=`
    <button class="btn btn-outline btn-sm" onclick="navigate('messages')" style="margin-bottom:14px;">← Back to chats</button>
    <div style="font-family:'Fraunces',serif;font-size:16px;font-weight:800;margin-bottom:4px;">${room.listing_name||'Customer Chat'}</div>
    <div style="font-size:10px;color:var(--sub);margin-bottom:16px;">Ref: ${room.ref||room.id?.slice(0,8)}</div>
    <div id="chat-msgs" style="min-height:200px;max-height:400px;overflow-y:auto;margin-bottom:14px;"></div>
    <div style="display:flex;gap:8px;align-items:flex-end;">
      <label style="width:36px;height:36px;border-radius:50%;border:1px solid var(--bdr);background:rgba(255,255,255,0.04);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;">
        <input type="file" accept="image/*,.pdf,.doc,.docx,.txt" style="display:none;" onchange="attachBizFile(this)"/>
        <span style="font-size:16px;">📎</span>
      </label>
      <textarea id="chat-input" placeholder="Type a message…" rows="2" style="flex:1;resize:none;padding:10px 13px;border-radius:10px;border:1px solid var(--bdr);background:rgba(255,255,255,0.05);color:var(--txt);font-family:'Outfit',sans-serif;font-size:13px;outline:none;"></textarea>
      <button class="btn btn-primary btn-sm" onclick="sendChatMsg()" style="align-self:flex-end;">Send →</button>
    </div>`;
  renderChatMsgs();
  $('chat-input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChatMsg();}});
  // Realtime
  if(CHAT_CHANNEL) sb.removeChannel(CHAT_CHANNEL);
  CHAT_CHANNEL=sb.channel('chat_'+room.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'direct_messages',filter:`room_id=eq.${room.id}`},payload=>{CHAT_MSGS.push(payload.new);renderChatMsgs();}).subscribe();
}

function renderChatMsgs(){
  const c=$('chat-msgs');if(!c) return;c.innerHTML='';
  CHAT_MSGS.forEach(m=>{
    const isMe=m.sender_role==='business';
    const row=document.createElement('div');row.className=`msg-row${isMe?' me':''}`;
    const bubble=document.createElement('div');
    bubble.className=`msg-bubble${isMe?' me':m.type==='system'?' system':' them'}`;
    bubble.style.whiteSpace='pre-wrap';
    if((m.type==='image'||m.type==='file')&&m.metadata?.url){
      if(m.metadata.isImage){
        const img=document.createElement('img');
        img.src=m.metadata.url;img.alt=m.metadata.name||'image';
        img.style.cssText='max-width:100%;max-height:260px;border-radius:8px;display:block;cursor:pointer;margin-bottom:4px;';
        img.onclick=()=>window.open(m.metadata.url,'_blank');
        bubble.appendChild(img);
      } else {
        const a=document.createElement('a');
        a.href=m.metadata.url;a.target='_blank';
        a.style.cssText='display:flex;gap:8px;align-items:center;padding:8px 10px;background:rgba(255,255,255,0.06);border-radius:8px;text-decoration:none;';
        a.innerHTML=`<span>📄</span><div><div style="font-size:12px;font-weight:700;color:var(--green);">${m.metadata.name||'Document'}</div><div style="font-size:9px;color:var(--sub);">Tap to open</div></div>`;
        bubble.appendChild(a);
      }
    } else { bubble.textContent=m.content||''; }
    row.appendChild(bubble);c.appendChild(row);
  });
  c.scrollTop=c.scrollHeight;
}

async function sendChatMsg(){
  const input=$('chat-input');const txt=input.value.trim();
  if(!txt||!ACTIVE_ROOM) return;
  input.value='';
  const{data:msg}=await sb.from('direct_messages').insert({
    room_id:ACTIVE_ROOM.id,
    sender_id:BIZ.user_id,
    sender_role:'business',
    content:txt,
    type:'text',
    read_by_customer:false,
    read_by_business:true,
    business_user_id:BIZ.user_id,
    customer_id:ACTIVE_ROOM.customer_id||null,
    business_id:BIZ.id,
    request_id:ACTIVE_ROOM.request_id||null,
  }).select().single();
  if(msg){CHAT_MSGS.push(msg);renderChatMsgs();}
  await sb.from('notifications').insert({user_id:ACTIVE_ROOM.user_id,icon:'💬',message:`${BIZ.name} sent you a message. Tap to read.`,type:'direct_message',metadata:{room_id:ACTIVE_ROOM.id}});
}

// ── SETTINGS ──────────────────────────────────────────────────────────────────
async function renderSettings(c){
  const{data}=await sb.from('business_accounts').select('phone').eq('id',BIZ.id).single();
  const phone=data?.phone||'';
  c.innerHTML=`
    <div class="card">
      <div class="card-title">📞 Contact Number (Private)</div>
      <p style="font-size:11px;color:var(--sub);margin-bottom:14px;"><strong style="color:#F5C550;">Never shown publicly.</strong> Only visible to Xairod admins for coordination.</p>
      <div style="display:flex;gap:10px;">
        <input type="tel" id="s-phone" value="${phone}" placeholder="+234 800 000 0000" style="flex:1;"/>
        <button class="btn btn-primary btn-sm" onclick="savePhone()">Save</button>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Account Info</div>
      ${[['Business',BIZ.name],['Category',BIZ.category],['Status',BIZ.status==='active'?'✓ Active':'⏳ Pending'],['Email',BIZ.email]].map(([l,v])=>`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.05);"><span style="font-size:11px;color:var(--sub);">${l}</span><span style="font-size:11px;font-weight:700;">${v||'—'}</span></div>`).join('')}
      <div style="margin-top:16px;font-size:11px;color:var(--sub);">Need help? <a href="mailto:hello@xairod.com" style="color:var(--green);">hello@xairod.com</a> · <a href="https://t.me/ckairod" style="color:var(--green);">t.me/ckairod</a></div>
    </div>`;
}
async function savePhone(){await sb.from('business_accounts').update({phone:$('s-phone').value}).eq('id',BIZ.id);showToast('Phone saved');}

// ── INIT ──────────────────────────────────────────────────────────────────────
sb.auth.getSession().then(async({data:{session}})=>{
  if(session?.user){
    const{data:rows}=await sb.from('business_accounts').select('*').eq('user_id',session.user.id).limit(1);
    if(rows?.[0]){BIZ=rows[0];await loadApp();return;}
  }
});
</script>
